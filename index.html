<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>NationForge — Country Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #080c18;
  --bg-secondary: #0d1424;
  --bg-card: #131c2e;
  --bg-card-hover: #182236;
  --bg-glass: rgba(19,28,46,0.7);
  --accent-gold: #f0b429;
  --accent-gold-dim: rgba(240,180,41,0.12);
  --accent-gold-glow: rgba(240,180,41,0.25);
  --accent-blue: #3b82f6;
  --accent-blue-dim: rgba(59,130,246,0.12);
  --accent-green: #10b981;
  --accent-green-dim: rgba(16,185,129,0.12);
  --accent-red: #ef4444;
  --accent-red-dim: rgba(239,68,68,0.12);
  --accent-purple: #8b5cf6;
  --accent-purple-dim: rgba(139,92,246,0.12);
  --accent-cyan: #06b6d4;
  --accent-cyan-dim: rgba(6,182,212,0.12);
  --accent-orange: #f97316;
  --accent-orange-dim: rgba(249,115,22,0.12);
  --text-primary: #f1f5f9;
  --text-secondary: #8899b4;
  --text-muted: #4a5a72;
  --border: rgba(255,255,255,0.05);
  --border-light: rgba(255,255,255,0.09);
  --shadow-heavy: 0 20px 60px rgba(0,0,0,0.6);
  --shadow-card: 0 4px 24px rgba(0,0,0,0.35);
  --radius: 16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { 
  height:100%; overflow:hidden; 
  font-family:'Outfit',sans-serif; 
  background:var(--bg-primary); color:var(--text-primary);
  touch-action:manipulation;
}

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:4px; }

body::before {
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  opacity: 0.4;
}

#app {
  height:100%; display:flex; flex-direction:column;
  max-width:480px; margin:0 auto;
  position:relative; overflow:hidden;
  z-index:1;
}

.screen {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  transition: transform 0.45s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
  will-change: transform, opacity;
}
.screen.hidden { transform:translateX(100%); opacity:0; pointer-events:none; }
.screen.hidden-left { transform:translateX(-25%); opacity:0; pointer-events:none; }

/* ===== SPLASH ===== */
#splashScreen {
  background: #080c18;
  align-items:center; justify-content:center; gap:20px; z-index:100;
  overflow:hidden;
}
.orbs { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0.35; animation: orbDrift 12s ease-in-out infinite; }
.orb:nth-child(1) { width:300px;height:300px; background:radial-gradient(circle,#f0b429,transparent); top:-80px;left:-80px; animation-delay:0s; }
.orb:nth-child(2) { width:250px;height:250px; background:radial-gradient(circle,#3b82f6,transparent); bottom:-60px;right:-60px; animation-delay:-4s; }
.orb:nth-child(3) { width:200px;height:200px; background:radial-gradient(circle,#8b5cf6,transparent); bottom:30%;left:20%; animation-delay:-8s; }
@keyframes orbDrift { 0%,100% { transform:translate(0,0) scale(1); } 33% { transform:translate(20px,-15px) scale(1.05); } 66% { transform:translate(-15px,10px) scale(0.97); } }

#splashScreen .logo-wrap { position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
#splashScreen .logo-ring { position:absolute; width:128px;height:128px; border-radius:50%; border:1px solid var(--accent-gold-glow); animation: ringPulse 2.5s ease-in-out infinite; }
#splashScreen .logo-ring2 { position:absolute; width:160px;height:160px; border-radius:50%; border:1px solid rgba(240,180,41,0.1); animation: ringPulse 2.5s ease-in-out infinite 0.4s; }
@keyframes ringPulse { 0%,100% { transform:scale(1); opacity:0.5; } 50% { transform:scale(1.06); opacity:1; } }
#splashScreen .logo-icon {
  width:96px; height:96px;
  background: linear-gradient(145deg, #f0b429 0%, #c97a00 60%, #f0b429 100%);
  border-radius:26px; display:flex; align-items:center; justify-content:center;
  font-size:46px;
  box-shadow: 0 0 0 1px rgba(240,180,41,0.3), 0 8px 32px rgba(240,180,41,0.35), 0 2px 8px rgba(0,0,0,0.5);
  position:relative; z-index:1;
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%,100% { box-shadow: 0 0 0 1px rgba(240,180,41,0.3), 0 8px 32px rgba(240,180,41,0.35), 0 2px 8px rgba(0,0,0,0.5); }
  50% { box-shadow: 0 0 0 1px rgba(240,180,41,0.5), 0 12px 48px rgba(240,180,41,0.5), 0 2px 8px rgba(0,0,0,0.5); }
}
#splashScreen h1 { font-family:'Syne',sans-serif; font-size:40px; font-weight:800; letter-spacing:-1.5px; background: linear-gradient(135deg, #fff 20%, var(--accent-gold) 80%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
#splashScreen .tagline { color:var(--text-muted); font-size:11px; font-weight:500; letter-spacing:4px; text-transform:uppercase; }
#splashScreen .version-tag { font-size:9px; color:var(--text-muted); letter-spacing:2px; position:absolute; bottom:24px; }

.start-btn {
  margin-top:40px; padding:15px 52px;
  background: linear-gradient(135deg, #f0b429, #c97a00);
  border:none; border-radius:50px; color:#000; font-family:inherit;
  font-size:15px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
  cursor:pointer; transition: all 0.25s ease;
  box-shadow: 0 4px 20px rgba(240,180,41,0.4), 0 1px 0 rgba(255,255,255,0.2) inset;
  position:relative; z-index:1;
}
.start-btn:hover { transform:translateY(-1px); box-shadow: 0 8px 30px rgba(240,180,41,0.5); }
.start-btn:active { transform:scale(0.97) translateY(1px); }

/* ===== SETUP ===== */
#setupScreen { background: var(--bg-primary); overflow-y:auto; padding:20px; }
.setup-header { text-align:center; padding:28px 0 20px; }
.setup-header h2 { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; letter-spacing:-0.5px; }
.setup-header p { color:var(--text-secondary); font-size:13px; margin-top:6px; }
.setup-section { margin-bottom:22px; }
.setup-section label { display:block; font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:2px; margin-bottom:10px; }
.setup-input { width:100%; padding:14px 16px; background:var(--bg-card); border:1px solid var(--border-light); border-radius:var(--radius-sm); color:var(--text-primary); font-family:inherit; font-size:16px; outline:none; transition: border-color 0.2s, box-shadow 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.2) inset; }
.setup-input:focus { border-color:var(--accent-gold); box-shadow: 0 0 0 3px var(--accent-gold-dim); }
.setup-input::placeholder { color:var(--text-muted); }
.govt-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.govt-option { padding:14px 10px; background:var(--bg-card); border:1.5px solid var(--border-light); border-radius:var(--radius-sm); text-align:center; cursor:pointer; transition:all 0.2s; }
.govt-option:active { transform:scale(0.97); }
.govt-option.selected { border-color:var(--accent-gold); background: linear-gradient(145deg, rgba(240,180,41,0.12), rgba(240,180,41,0.05)); box-shadow: 0 0 0 1px rgba(240,180,41,0.2), 0 4px 16px rgba(240,180,41,0.1); }
.govt-option .govt-icon { font-size:28px; margin-bottom:5px; }
.govt-option .govt-name { font-size:12px; font-weight:700; }
.govt-option .govt-desc { font-size:10px; color:var(--text-muted); margin-top:2px; }
.continent-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.continent-option { padding:12px 6px; background:var(--bg-card); border:1.5px solid var(--border-light); border-radius:var(--radius-sm); text-align:center; cursor:pointer; transition:all 0.2s; }
.continent-option:active { transform:scale(0.97); }
.continent-option.selected { border-color:var(--accent-blue); background:var(--accent-blue-dim); box-shadow:0 0 0 1px rgba(59,130,246,0.2); }
.continent-option .cont-icon { font-size:22px; }
.continent-option .cont-name { font-size:10px; font-weight:700; margin-top:4px; color:var(--text-secondary); }
.diff-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.diff-option { padding:14px 8px; background:var(--bg-card); border:1.5px solid var(--border-light); border-radius:var(--radius-sm); text-align:center; cursor:pointer; transition:all 0.2s; }
.diff-option:active { transform:scale(0.97); }
.diff-option.selected { border-color:var(--accent-green); background:var(--accent-green-dim); box-shadow:0 0 0 1px rgba(16,185,129,0.2); }
.diff-option .diff-icon { font-size:22px; }
.diff-option .diff-name { font-size:11px; font-weight:700; margin-top:4px; }
.begin-btn { width:100%; padding:16px; margin-top:20px; margin-bottom:40px; background: linear-gradient(135deg, #f0b429, #c97a00); border:none; border-radius:var(--radius-sm); color:#000; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer; letter-spacing:1px; text-transform:uppercase; box-shadow: 0 4px 20px rgba(240,180,41,0.35); transition: all 0.25s; }
.begin-btn:hover { box-shadow: 0 6px 28px rgba(240,180,41,0.5); }
.begin-btn:active { transform:scale(0.98); }

/* ===== GAME SCREEN ===== */
#gameScreen { background:var(--bg-primary); }

/* Alert badge for critical stats */
.alert-pulse { animation: alertPulse 1.2s ease-in-out infinite; }
@keyframes alertPulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

/* Top Bar */
.top-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px;
  background:linear-gradient(180deg, var(--bg-secondary) 0%, rgba(13,20,36,0.95) 100%);
  border-bottom:1px solid var(--border);
  position:relative; z-index:10;
  backdrop-filter: blur(12px);
}
.top-bar::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(240,180,41,0.2),transparent); }
.top-bar .nation-info { display:flex; align-items:center; gap:10px; }
.nation-flag { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; background:linear-gradient(145deg, rgba(240,180,41,0.15), rgba(240,180,41,0.05)); border:1px solid rgba(240,180,41,0.2); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.nation-name { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; letter-spacing:-0.3px; }
.nation-year { font-size:10px; color:var(--text-muted); font-family:'Space Mono',monospace; margin-top:1px; }
.top-actions { display:flex; gap:6px; align-items:center; }
.top-btn { width:34px; height:34px; border-radius:10px; background:var(--bg-card); border:1px solid var(--border-light); display:flex; align-items:center; justify-content:center; color:var(--text-secondary); font-size:14px; cursor:pointer; transition: all 0.2s; position:relative; }
.top-btn:hover { background:var(--bg-card-hover); border-color:rgba(255,255,255,0.15); }
.top-btn:active { transform:scale(0.93); }
.notif-badge { position:absolute; top:-3px; right:-3px; width:14px; height:14px; border-radius:50%; background:var(--accent-red); font-size:8px; font-weight:900; display:flex; align-items:center; justify-content:center; color:#fff; border:1.5px solid var(--bg-secondary); }

/* News Ticker */
.news-ticker {
  background: rgba(240,180,41,0.06);
  border-bottom:1px solid rgba(240,180,41,0.12);
  padding:5px 0;
  overflow:hidden; position:relative;
  height:24px;
}
.news-ticker-inner {
  display:flex; align-items:center;
  white-space:nowrap;
  animation: tickerScroll 28s linear infinite;
  font-size:10px; color:rgba(240,180,41,0.7);
  font-weight:600; letter-spacing:0.3px;
  padding-left:100%;
}
@keyframes tickerScroll { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }
.ticker-dot { display:inline-block; width:4px; height:4px; border-radius:50%; background:var(--accent-gold); margin:0 10px; opacity:0.5; vertical-align:middle; }

/* Resource Bar */
.resource-bar { display:flex; gap:4px; padding:7px 10px; background:var(--bg-secondary); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
.resource-bar::-webkit-scrollbar { display:none; }
.res-chip { display:flex; align-items:center; gap:4px; padding:5px 10px; background:rgba(255,255,255,0.03); border:1px solid var(--border-light); border-radius:20px; white-space:nowrap; flex-shrink:0; transition: all 0.2s; }
.res-chip .res-icon { font-size:11px; }
.res-chip .res-val { font-size:11px; font-weight:700; font-family:'Space Mono',monospace; }
.res-chip .res-delta { font-size:8px; font-weight:700; margin-left:1px; }
.res-chip.positive .res-val { color:#34d399; }
.res-chip.negative .res-val { color:#f87171; }
.res-chip.neutral .res-val { color:var(--text-secondary); }
.res-chip.critical { border-color:rgba(239,68,68,0.4); animation:alertPulse 1.2s ease-in-out infinite; }

/* Leader Bar */
.leader-bar {
  display:flex; align-items:center; gap:10px;
  padding:8px 14px;
  background:rgba(255,255,255,0.015);
  border-bottom:1px solid var(--border);
}
.leader-avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; border:1.5px solid rgba(139,92,246,0.3); }
.leader-info { flex:1; min-width:0; }
.leader-name { font-size:11px; font-weight:700; }
.leader-trait { font-size:9px; color:var(--text-muted); }
.leader-approval { font-size:11px; font-weight:800; font-family:'Space Mono',monospace; }
.election-badge { font-size:9px; font-weight:800; letter-spacing:0.5px; padding:2px 7px; border-radius:5px; background:rgba(240,180,41,0.12); color:var(--accent-gold); border:1px solid rgba(240,180,41,0.2); flex-shrink:0; }

/* Sparkline */
.sparkline-wrap { position:relative; height:28px; }
.sparkline-wrap svg { position:absolute; inset:0; }

/* Game Content */
.game-content { flex:1; overflow-y:auto; padding:12px; padding-bottom:96px; scroll-behavior:smooth; }

/* Stats Cards */
.stats-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.stat-card {
  background: linear-gradient(145deg, var(--bg-card), rgba(13,20,36,0.8));
  border-radius:var(--radius-sm); padding:14px; border:1px solid var(--border);
  position:relative; overflow:hidden; box-shadow: var(--shadow-card);
  transition: transform 0.2s, border-color 0.2s;
}
.stat-card:active { transform:scale(0.97); }
.stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; border-radius:2px 2px 0 0; }
.stat-card::after { content:''; position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(135deg,rgba(255,255,255,0.02) 0%,transparent 60%); pointer-events:none; }
.stat-card.gold::before { background:linear-gradient(90deg, var(--accent-gold), #c97a00); }
.stat-card.blue::before { background:linear-gradient(90deg, var(--accent-blue), #1d4ed8); }
.stat-card.green::before { background:linear-gradient(90deg, var(--accent-green), #059669); }
.stat-card.red::before { background:linear-gradient(90deg, var(--accent-red), #dc2626); }
.stat-card.purple::before { background:linear-gradient(90deg, var(--accent-purple), #7c3aed); }
.stat-card.cyan::before { background:linear-gradient(90deg, var(--accent-cyan), #0891b2); }
.stat-card.orange::before { background:linear-gradient(90deg, var(--accent-orange), #c2410c); }
.stat-card .stat-label { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; }
.stat-card .stat-value { font-size:20px; font-weight:800; margin-top:3px; font-family:'Space Mono',monospace; }
.stat-card .stat-change { font-size:10px; margin-top:3px; font-weight:600; }
.stat-card .stat-change.up { color:var(--accent-green); }
.stat-card .stat-change.down { color:var(--accent-red); }
.stat-card .stat-mini { position:absolute; bottom:10px; right:10px; opacity:0.25; font-size:28px; }

/* Approval */
.approval-section { background: linear-gradient(145deg, var(--bg-card), rgba(13,20,36,0.7)); border-radius:var(--radius); padding:16px; margin-bottom:12px; border:1px solid var(--border); box-shadow: var(--shadow-card); position:relative; overflow:hidden; }
.approval-section::before { content:''; position:absolute; top:0; right:0; width:80px;height:80px; background:radial-gradient(circle, rgba(240,180,41,0.06) 0%,transparent 70%); }
.approval-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.approval-title { font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; }
.approval-pct { font-size:22px; font-weight:800; font-family:'Space Mono',monospace; }
.approval-bar-track { height:6px; background:rgba(255,255,255,0.04); border-radius:3px; overflow:hidden; margin-bottom:10px; box-shadow: 0 1px 4px rgba(0,0,0,0.3) inset; }
.approval-bar-fill { height:100%; border-radius:3px; transition: width 0.7s cubic-bezier(0.16,1,0.3,1), background 0.4s ease; position:relative; }
.approval-bar-fill::after { content:''; position:absolute; right:0; top:0; bottom:0; width:6px; background:rgba(255,255,255,0.4); border-radius:50%; filter:blur(2px); }
.approval-factors { display:flex; gap:5px; flex-wrap:wrap; }
.factor-tag { padding:3px 8px; border-radius:10px; font-size:10px; font-weight:600; border:1px solid transparent; }

/* Sector Tabs */
.sector-tabs { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; scrollbar-width:none; padding:2px 0; }
.sector-tabs::-webkit-scrollbar { display:none; }
.sector-tab { padding:8px 14px; border-radius:20px; background:var(--bg-card); border:1px solid var(--border-light); white-space:nowrap; font-size:12px; font-weight:600; cursor:pointer; flex-shrink:0; transition:all 0.2s; display:flex; align-items:center; gap:5px; color:var(--text-secondary); }
.sector-tab:active { transform:scale(0.96); }
.sector-tab.active { background:var(--accent-gold); color:#000; border-color:var(--accent-gold); box-shadow: 0 2px 12px rgba(240,180,41,0.35); font-weight:700; }
.sector-tab .tab-icon { font-size:13px; }

/* Sector Content */
.sector-content { background: linear-gradient(145deg, var(--bg-card), rgba(13,20,36,0.7)); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; margin-bottom:10px; box-shadow: var(--shadow-card); }
.sector-header { padding:13px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.015); }
.sector-header h3 { font-size:13px; font-weight:700; letter-spacing:-0.2px; }
.sector-body { padding:14px; }

/* Policy Cards */
.policy-card { background:rgba(255,255,255,0.02); border-radius:var(--radius-xs); padding:12px; margin-bottom:8px; border:1px solid var(--border); cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
.policy-card:hover { background:rgba(255,255,255,0.04); border-color:var(--border-light); }
.policy-card:active { transform:scale(0.985); }
.policy-card.active-policy { border-color:rgba(16,185,129,0.25); background:rgba(16,185,129,0.03); }
.policy-card .policy-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.policy-card .policy-name { font-size:13px; font-weight:700; }
.policy-card .policy-cost { font-size:10px; font-weight:700; font-family:'Space Mono',monospace; padding:3px 8px; border-radius:8px; }
.policy-card .policy-desc { font-size:11px; color:var(--text-secondary); line-height:1.5; }
.policy-card .policy-effects { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
.policy-effect { font-size:10px; padding:2px 7px; border-radius:6px; font-weight:700; }
.policy-effect.positive { background:rgba(16,185,129,0.12); color:#34d399; border:1px solid rgba(16,185,129,0.2); }
.policy-effect.negative { background:rgba(239,68,68,0.12); color:#f87171; border:1px solid rgba(239,68,68,0.2); }
.policy-card .annual-cost { font-size:9px; color:var(--text-muted); margin-top:5px; display:flex; align-items:center; gap:4px; }

/* Build Cards */
.build-card { display:flex; gap:12px; padding:12px; background:rgba(255,255,255,0.02); border-radius:var(--radius-xs); border:1px solid var(--border); margin-bottom:8px; cursor:pointer; transition:all 0.2s; }
.build-card:hover { background:rgba(255,255,255,0.04); }
.build-card:active { transform:scale(0.985); }

.nav-item::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:0; height:2px; background:var(--accent-gold); border-radius:0 0 2px 2px; transition: width 0.3s cubic-bezier(0.16,1,0.3,1); }
.nav-item.active { color:var(--accent-gold); }
.nav-item.active::before { width:24px; }
.nav-item .nav-icon { font-size:18px; }
.nav-item .nav-label { font-weight:700; letter-spacing:0.3px; text-transform:uppercase; }
.nav-alert { position:absolute; top:4px; right:calc(50% - 14px); width:7px; height:7px; border-radius:50%; background:var(--accent-red); border:1.5px solid var(--bg-secondary); animation:alertPulse 1.2s ease-in-out infinite; }

/* Modal */
.modal-overlay { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,0.65); backdrop-filter:blur(12px); display:flex; align-items:flex-end; justify-content:center; transition:opacity 0.3s; }

/* Toast */
.toast-container { position:absolute; top:72px; left:12px; right:12px; z-index:60; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
.toast { padding:11px 14px; border-radius:var(--radius-xs); background:rgba(19,28,46,0.97); border:1px solid var(--border-light); display:flex; align-items:center; gap:8px; animation: toastIn 0.35s cubic-bezier(0.16,1,0.3,1), toastOut 0.3s ease 2.7s forwards; box-shadow: 0 8px 24px rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
@keyframes toastIn { from { transform:translateY(-16px) scale(0.95); opacity:0; } to { transform:translateY(0) scale(1); opacity:1; } }

.turn-overlay { position:absolute; inset:0; z-index:70; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; transition:opacity 0.4s; backdrop-filter: blur(8px); }

.turn-overlay .turn-label { color:var(--text-muted); font-size:12px; letter-spacing:3px; text-transform:uppercase; }
.turn-overlay .turn-summary { margin-top:10px; text-align:center; display:flex; flex-direction:column; gap:4px; }
.turn-overlay .turn-item { font-size:12px; font-weight:600; }
.turn-overlay .turn-dots { display:flex; gap:6px; margin-top:16px; }
.turn-dot { width:6px;height:6px;border-radius:50%; background:var(--accent-gold); opacity:0.3; animation:dotPulse 1.2s ease-in-out infinite; }

@keyframes dotPulse { 0%,100%{opacity:0.3;transform:scale(1);} 50%{opacity:1;transform:scale(1.3);} }

.achievement-badge { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:8px; background:rgba(240,180,41,0.08); border:1px solid rgba(240,180,41,0.2); font-size:10px; font-weight:700; color:var(--accent-gold); margin:3px; }

/* War visual */
.war-visual { text-align:center; padding:20px; background:rgba(239,68,68,0.05); border-radius:var(--radius-xs); border:1px solid rgba(239,68,68,0.15); margin-top:12px; }

@keyframes flashRed { 0%,100%{background:transparent;} 40%{background:rgba(239,68,68,0.15);} }

@keyframes fadeUp { from { transform:translateY(10px); opacity:0; } to { transform:translateY(0); opacity:1; } }

.fade-up-d2 { animation-delay:0.1s; }

function applyLeaderTrait() {
  const trait = LEADER_TRAITS.find(t=>t.id===G.leaderTrait);

  Object.entries(trait.modifiers).forEach(([k,v])=>{
    if(G[k]!==undefined) G[k]=clamp(G[k]+v);
  });
}

function generateLeaderName() {
  const first = ['Alexander','Maria','Chen','Aisha','Viktor','Elena','Santiago','Fatima','James','Yuki','Omar','Sofia','Raj','Amara','Dmitri'];
  const last = ['Petrov','Santos','Chen','Al-Rashid','Mueller','Okafor','Nakamura','Silva','Ivanova','Patel','Kim','Diallo','Andersen'];
  return first[Math.floor(Math.random()*first.length)] + ' ' + last[Math.floor(Math.random()*last.length)];
}

function clamp(v, min=0, max=100) { return Math.max(min, Math.min(max, v)); }
function clampStat(key) { if(key==='treasury'||key==='totalDebt') return; G[key] = clamp(G[key]); }

// ---- CURRENCY FORMATTING ----
// Treasury stored in MILLIONS USD
function fmtMoney(n) {
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if(abs >= 1000000) return sign + '$' + (abs/1000000).toFixed(2) + 'T'; // Trillions
  if(abs >= 1000) return sign + '$' + (abs/1000).toFixed(1) + 'B';      // Billions
  if(abs >= 1) return sign + '$' + abs.toFixed(0) + 'M';                 // Millions
  return sign + '$' + (abs*1000).toFixed(0) + 'K';
}

function fmtMoneyShort(n) {
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if(abs >= 1000000) return sign + '$' + (abs/1000000).toFixed(1) + 'T';
  if(abs >= 1000) return sign + '$' + (abs/1000).toFixed(1) + 'B';
  return sign + '$' + abs.toFixed(0) + 'M';
}

function fmt(n) {
  if(n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if(n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if(n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return n.toString();
}

  const name = document.getElementById('nationNameInput').value.trim() || 'New Republic';

  renderGame();

function drawSparkline() {
  const canvas = document.getElementById('sparklineCanvas');
  if(!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 52;
  const ctx = canvas.getContext('2d');
  const data = G.gdpHistory;
  if(data.length < 2) return;
  
  const min = Math.min(...data) * 0.95;
  const max = Math.max(...data) * 1.05;
  const W = canvas.width, H = canvas.height;
  const pad = { t:4, r:4, b:4, l:4 };
  
  const pts = data.map((v,i)=>[
    pad.l + (i/(data.length-1))*(W-pad.l-pad.r),
    H - pad.b - ((v-min)/(max-min||1))*(H-pad.t-pad.b)
  ]);
  
  // Area fill
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(240,180,41,0.25)');
  grad.addColorStop(1,'rgba(240,180,41,0)');
  
  ctx.beginPath();
  ctx.moveTo(pts[0][0], H-pad.b);
  pts.forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.lineTo(pts[pts.length-1][0], H-pad.b);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  
  // Line
  ctx.beginPath();
  pts.forEach((p,i)=>i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
  ctx.strokeStyle = '#f0b429';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();
  
  // End dot
  const last = pts[pts.length-1];
  ctx.beginPath();
  ctx.arc(last[0], last[1], 3.5, 0, Math.PI*2);
  ctx.fillStyle = '#f0b429';
  ctx.fill();
}

function renderProgressBar(label, key, color, inverted=false) {
  const val = G[key];
  const displayColor = inverted ? (val>50?'var(--accent-red)':'var(--accent-green)') : (val<25?'var(--accent-red)':val<45?'var(--accent-gold)':color);
  return `<div class="progress-row">
    <div class="progress-label"><span class="pl-name">${label}</span><span class="pl-val" style="color:${displayColor}">${Math.round(val)}/100</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${val}%;background:${displayColor}"></div></div>
  </div>`;
}

function findPolicy(id) {
  for(let cat of Object.values(POLICIES)) {
    const p = cat.find(x=>x.id===id);
    if(p) return p;
  }
  return null;
}

    <span style="font-size:11px;color:var(--text-muted);">Active: <strong style="color:var(--text-secondary);">${G.activePolicies.length}</strong></span>

function enactPolicy(id) {
  const p = findPolicy(id);
  if(!p) return;
  if(G.activePolicies.includes(id)) { toast('ℹ️','Already active'); return; }
  if(G.treasury < p.cost) { toast('❌',`Need ${fmtMoneyShort(p.cost)} — only ${fmtMoneyShort(G.treasury)} available`,'error'); return; }
  
  G.treasury -= p.cost;
  G.activePolicies.push(id);
  G.policiesEnacted++;
  
  applyEffects(p.effects, true);
  addLog('📜', `Enacted: ${p.name}`, G.year);
  
  if(p.id==='nukes') { G.hasNukes=true; addNews(`☢️ ${G.name} has successfully tested a nuclear device!`); }
  if(p.id==='space') { G.hasSpace=true; addNews(`🚀 ${G.name} Space Agency established — mission to the stars begins!`); }
  
  toast('✅', `${p.name} enacted!`, 'success');
  checkAchievements();
  renderGame();
}

function removePolicy(id) {
  const p = findPolicy(id);
  if(!p) return;
  if(!p.annualCost || p.oneTime) { toast('ℹ️','This policy cannot be repealed'); return; }
  G.activePolicies = G.activePolicies.filter(x=>x!==id);
  addLog('❌', `Repealed: ${p.name}`, G.year);
  toast('❌', `${p.name} repealed`, 'warn');
  renderGame();
}

function applyEffects(effects, instant=false) {
  Object.entries(effects).forEach(([k,v]) => {
    if(k==='treasury') G.treasury += v * (instant ? 5 : 10);
    else if(k==='population') G.population = Math.floor(G.population * (1 + v/100));
    else if(k==='trade') G.trade = clamp(G.trade + v);
    else if(k==='production') G.production = clamp(G.production + v);
    else if(k==='energy') G.energy = clamp(G.energy + v);
    else if(k==='tourism') G.tourism = clamp(G.tourism + v);
    else if(k==='espionage') G.espionage = clamp(G.espionage + v);
    else if(G[k] !== undefined) G[k] = clamp(G[k] + v);
  });
}

function militaryAction(type) {
  const actions = {
    recruit: { cost:300, effects:{military:5, happiness:-2}, msg:'Recruitment drive complete! Military +5' },
    modernize: { cost:600, effects:{military:8, treasury:-2}, msg:'Modernization complete! Military +8' },
    intel: { cost:400, effects:{espionage:6}, msg:'Intelligence network expanded! Espionage +6' },
  };
  const a = actions[type];
  if(!a) return;
  if(G.treasury < a.cost) { toast('❌',`Need ${fmtMoneyShort(a.cost)}`,'error'); return; }
  G.treasury -= a.cost;
  applyEffects(a.effects, true);
  toast('⚔️', a.msg, 'success');
  checkAchievements();
  renderGame();
}

function renderSpyPanel() {
  let h = `<div style="padding:12px;background:var(--bg-card);border-radius:var(--radius-xs);border:1px solid var(--border);margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">

    </div>

  </div>
  <div class="section-divider">Available Missions</div>`;
  
  // Select target nation
  const targets = G.aiNations.filter(n=>!n.atWar&&!n.alliance);
  const targetName = targets.length>0?targets[Math.floor(G.year*7%targets.length)].name:'Unknown';
  
  SPY_MISSIONS.forEach(m => {
    const canAfford = G.treasury >= m.cost;
    h += `<div class="spy-mission ${!canAfford?'locked':''}" onclick="${canAfford?`runSpyMission('${m.id}')`:''}" style="${!canAfford?'opacity:0.5;cursor:not-allowed':''}">
      <div class="spy-top">
        <span class="spy-name">${m.icon} ${m.name}</span>
        <span class="spy-cost">${fmtMoneyShort(m.cost)}</span>
      </div>
      <div class="spy-desc">${m.desc} Target: <strong>${targetName}</strong></div>
      <div class="spy-risk ${m.risk}">Risk: ${m.risk.toUpperCase()} · Success rate: ${Math.floor(m.success*100+(G.espionage-30)*0.2)}%</div>
    </div>`;
  });
  
  return h + '<div style="height:20px;"></div>';
}

function runSpyMission(id) {
  const m = SPY_MISSIONS.find(x=>x.id===id);
  if(!m||G.treasury<m.cost) return;
  G.treasury -= m.cost;
  
  const successChance = m.success + (G.espionage - 30) * 0.002;
  const success = Math.random() < successChance;
  
  if(success) {
    applyEffects(m.effects, true);
    G.spySuccesses++;
    addLog('🕵️', `Mission "${m.name}" succeeded!`, G.year);
    toast('🕵️', `Mission success! ${m.name} completed.`, 'success');
  } else {
    applyEffects(m.failEffects, true);
    addLog('⚠️', `Mission "${m.name}" failed — agent burned!`, G.year);
    toast('💥', `Mission failed! Diplomatic consequences.`, 'error');
  }
  
  checkAchievements();
  renderGame();
}

function showDiploModal(idx) {
  const n = G.aiNations[idx];
  const relClass = n.atWar?'at-war hostile':n.alliance?'allied':n.relation>60?'friendly':n.relation>35?'neutral':'hostile';
  const relLabel = n.atWar?'⚔️ AT WAR':n.alliance?'🤝 Allied':n.relation>60?'Friendly':n.relation>35?'Neutral':'Hostile';
  
  let actions = '';
  if(!n.atWar) {
    if(!n.tradeAgreement && n.relation>30) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'trade')">📦 Propose Trade Agreement <span class="choice-cost">${fmtMoneyShort(500)}</span></div>`;
    }
    if(!n.alliance && n.relation>60) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'ally')">🤝 Form Military Alliance <span class="choice-cost">${fmtMoneyShort(1000)}</span></div>`;
    }
    if(n.relation<70) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'gift')">🎁 Foreign Aid Grant (+15 relations) <span class="choice-cost">${fmtMoneyShort(800)}</span></div>`;
    }
    if(n.relation<50) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'sanction')">🚫 Impose Economic Sanctions (−relations)</div>`;
    }
    if(n.relation<60 && !n.atWar) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'war')" style="border-color:rgba(239,68,68,0.3);color:#f87171;">⚔️ Declare War — Mobilize Armed Forces</div>`;
    }
  } else {
    actions += `<div class="event-choice" onclick="diploAction(${idx},'peace')">🕊️ Negotiate Peace Treaty <span class="choice-cost">${fmtMoneyShort(2000)}</span></div>`;
    actions += `<div class="event-choice" onclick="diploAction(${idx},'push')">💣 Push War Effort (−${fmtMoneyShort(500)}, +Military chance)</div>`;
  }
  
  document.getElementById('modalContent').innerHTML = `
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:60px;line-height:1;margin-bottom:10px;">${n.flag}</div>
      <div class="modal-title">${n.name}</div>
      <div class="diplo-relation ${relClass}" style="display:inline-block;margin-top:6px;font-size:12px;padding:4px 12px;">${relLabel} · ${n.relation}/100</div>
    </div>
    <div class="sector-content" style="margin-bottom:16px;">
      <div class="sector-body">
        <div class="info-row"><span class="info-label">Strategy</span><span class="info-val" style="text-transform:capitalize">${n.personality}</span></div>
        <div class="info-row"><span class="info-label">Military Strength</span><span class="info-val">${n.strength}/100</span></div>
        <div class="info-row"><span class="info-label">Trade Agreement</span><span class="info-val" style="color:${n.tradeAgreement?'#34d399':'#f87171'}">${n.tradeAgreement?'✅ Active':'❌ None'}</span></div>
        <div class="info-row"><span class="info-label">Alliance Status</span><span class="info-val" style="color:${n.alliance?'#34d399':'#f87171'}">${n.alliance?'✅ Allied':'❌ None'}</span></div>
      </div>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;">Diplomatic Options</div>
    ${actions||'<div class="empty-state" style="padding:12px 0"><div style="font-size:11px;">No diplomatic actions available</div></div>'}
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function diploAction(idx, action) {
  const n = G.aiNations[idx];
  switch(action) {
    case 'trade':
      if(G.treasury<500){toast('❌',`Need ${fmtMoneyShort(500)}`,'error');return;}
      G.treasury-=500; n.tradeAgreement=true; n.relation=Math.min(100,n.relation+10);
      G.trade=clamp(G.trade+5);
      addLog('📦',`Trade agreement signed with ${n.name}`,G.year);
      addNews(`📦 ${G.name} signs trade agreement with ${n.name}`);
      toast('📦',`Trade agreement with ${n.name}!`,'success');
      break;
    case 'ally':
      if(G.treasury<1000){toast('❌',`Need ${fmtMoneyShort(1000)}`,'error');return;}
      G.treasury-=1000; n.alliance=true; n.relation=Math.min(100,n.relation+20);
      G.allies++;
      addLog('🤝',`Military alliance formed with ${n.name}`,G.year);
      addNews(`🤝 ${G.name} and ${n.name} sign historic mutual defense pact`);
      toast('🤝',`Alliance formed with ${n.name}!`,'success');
      break;
    case 'gift':
      if(G.treasury<800){toast('❌',`Need ${fmtMoneyShort(800)}`,'error');return;}
      G.treasury-=800; n.relation=Math.min(100,n.relation+15);
      addLog('🎁',`Foreign aid sent to ${n.name}`,G.year);
      toast('🎁',`Relations improved with ${n.name}!`,'success');
      break;
    case 'sanction':
      n.relation=Math.max(0,n.relation-12); G.diplomacy=clamp(G.diplomacy-3);
      addLog('🚫',`Sanctions imposed on ${n.name}`,G.year);
      toast('🚫',`Sanctions imposed on ${n.name}`,'warn');
      break;
    case 'war':
      n.atWar=true; n.alliance=false; n.tradeAgreement=false; n.relation=0;
      G.warState={enemy:idx,turns:0};
      G.diplomacy=clamp(G.diplomacy-10);
      addLog('⚔️',`War declared on ${n.name}`,G.year);
      addNews(`⚔️ BREAKING: ${G.name} declares war on ${n.name}!`);
      toast('⚔️',`War declared on ${n.name}!`,'error');
      break;
    case 'peace':
      if(G.treasury<2000){toast('❌',`Need ${fmtMoneyShort(2000)}`,'error');return;}
      G.treasury-=2000; n.atWar=false; n.relation=20;
      G.warState=null;
      addLog('🕊️',`Peace treaty with ${n.name}`,G.year);
      addNews(`🕊️ ${G.name} and ${n.name} sign ceasefire agreement`);
      toast('🕊️',`Peace with ${n.name}!`,'success');
      break;
    case 'push':
      if(G.treasury<500){toast('❌',`Need ${fmtMoneyShort(500)}`,'error');return;}
      G.treasury-=500; G.military=clamp(G.military+3);
      toast('⚔️','War effort intensified! +3 Military chance','warn');
      break;
  }
  updateRelationLabels();
  closeModal();
  checkAchievements();
  renderGame();
}

function updateRelationLabels() {
  G.aiNations.forEach(n => {
    n.relationLabel = n.atWar?'hostile':n.alliance?'allied':n.relation>60?'friendly':n.relation>35?'neutral':'hostile';
  });
  G.allies = G.aiNations.filter(n=>n.alliance).length;
}

// ---- EVENTS ----
function resolveEvent(choiceIdx) {
  if(!G.pendingEvent) return;
  const choice = G.pendingEvent.choices[choiceIdx];
  
  // Apply treasury cost from choice
  if(choice.cost) {
    const match = choice.cost.match(/\$([\d,]+)([BMK]?)/);
    if(match) {
      let amt = parseFloat(match[1].replace(',',''));
      if(match[2]==='B') amt *= 1000;
      else if(match[2]==='M') amt *= 1;
      else if(match[2]==='K') amt *= 0.001;
      G.treasury -= amt;
    }
  }
  
  applyEffects(choice.effects, true);
  addLog('📢', `${G.pendingEvent.title}: "${choice.text.substring(0,40)}..."`, G.year);
  toast('📢', `Decision: ${G.pendingEvent.title.substring(0,30)}...`, 'success');
  G.pendingEvent = null;
  checkAchievements();
  renderGame();
}

function triggerRandomEvent() {
  if(G.pendingEvent) return;
  // Higher difficulty = more events
  const chance = G.difficulty==='hard'?0.7:G.difficulty==='normal'?0.55:0.4;
  if(Math.random() < chance) {
    // Weight crisis events more in hard mode
    let pool = [...EVENTS];
    if(G.difficulty==='hard') pool = pool.concat(EVENTS.filter(e=>e.type==='crisis'));
    const evt = pool[Math.floor(Math.random()*pool.length)];
    G.pendingEvent = JSON.parse(JSON.stringify(evt));
    G.newNotifications = true;
  }
  
  // Election trigger
  if(G.govt==='democracy' && G.year >= G.electionYear) {
    triggerElection();
  }
}

function triggerElection() {
  G.pendingEvent = {
    type: 'election',
    title: `⚡ Election Season — Year ${G.year}`,
    desc: `With an approval rating of ${Math.round(G.approval)}%, the nation heads to the polls. The people will decide whether ${G.leaderName} retains power.`,
    choices: [
      { text:`🗳️ Run Bold Campaign — Spend big on promises`, effects:{happiness:10, treasury:-15, stability:5}, cost:'$150M', tags:[{t:'Approval +10',p:true}] },
      { text:`⚖️ Conservative Campaign — Steady as she goes`, effects:{stability:8, happiness:3}, cost:null, tags:[{t:'Stability +8',p:true}] },
      { text:`💰 Buy Vote — Populist giveaways`, effects:{happiness:15, treasury:-25, corruption:5}, cost:'$250M', tags:[{t:'Votes secured',p:true},{t:'Corruption +5',p:false}] },
    ]
  };
  G.electionYear = G.year + 4;
  G.newNotifications = true;
}

// ---- NEXT TURN ----
function nextTurn() {
  if(G.pendingEvent) {
    toast('⚠️','Resolve the current event first!','warn');
    currentNavTab='home'; renderBottomNav(); renderGameContent();
    return;
  }
  
  G.year++;
  const prevTreasury = G.treasury;
  const prevGdp = G.gdpPerCapita;
  
  const overlay = document.getElementById('turnOverlay');
  document.getElementById('turnYear').textContent = `Year ${G.year}`;
  overlay.classList.remove('hidden');
  
  processTurn();
  
  // Turn summary items
  const net = G.treasuryIncome - G.treasuryExpense;
  const gdpChange = G.gdpPerCapita - prevGdp;
  document.getElementById('turnSummary').innerHTML = `
    <div class="turn-item" style="color:${net>=0?'#34d399':'#f87171'}">${net>=0?'▲':'▼'} Budget: ${fmtMoneyShort(Math.abs(net))}/yr</div>
    <div class="turn-item" style="color:${gdpChange>=0?'#34d399':'#f87171'}">${gdpChange>=0?'▲':'▼'} GDP: $${Math.abs(Math.round(gdpChange))}/capita</div>
    <div class="turn-item" style="color:var(--text-muted)">👥 Pop: ${fmt(G.population)}</div>
  `;
  
  setTimeout(() => {
    overlay.classList.add('hidden');
    renderGame();
  }, 1100);
}

function processTurn() {
  // Population growth
  const growthFactor = 1 + (G.populationGrowth / 100) * (G.health/80) * (G.happiness/60);
  G.population = Math.floor(G.population * growthFactor);
  G.populationGrowth = clamp(G.populationGrowth + (Math.random()-0.45)*0.1, 0.5, 3.5);
  
  // GDP per capita growth
  const gdpGrowthRate = ((G.economy - 45) / 500) + (G.research / 2000) + (G.trade / 2000);
  G.gdpPerCapita = Math.floor(G.gdpPerCapita * (1 + gdpGrowthRate));
  G.gdpPerCapita = Math.max(500, G.gdpPerCapita);
  G.gdpHistory.push(G.gdpPerCapita);
  if(G.gdpHistory.length > 40) G.gdpHistory.shift();
  
  // Income/Expense calculation (millions USD)
  const popM = G.population / 1000000; // population in millions
  G.treasuryIncome = Math.floor((G.economy * 15 + G.trade * 10 + G.production * 6 + G.tourism * 4) * popM * (G.difficulty==='easy'?1.2:G.difficulty==='hard'?0.75:1));
  
  // Annual policy costs
  let policyExpenses = G.activePolicies.reduce((sum, id) => {
    const p = findPolicy(id);
    return sum + (p ? (p.annualCost||0) : 0);
  }, 0);
  
  G.treasuryExpense = Math.floor(G.military * 15 * popM * 0.3 + policyExpenses + popM * 20 + 100);
  G.treasury += G.treasuryIncome - G.treasuryExpense;
  G.treasuryHistory.push(G.treasury);
  if(G.treasuryHistory.length > 40) G.treasuryHistory.shift();
  
  // National debt dynamics
  const deficit = G.treasuryIncome - G.treasuryExpense;
  if(deficit < 0) G.totalDebt -= deficit; // Debt increases with deficit
  else G.totalDebt = Math.max(0, G.totalDebt - deficit * 0.3); // Slowly pay down debt
  G.debtGdpRatio = (G.totalDebt / Math.max(1, getGdpTotal())) * 100;
  
  // Stat drift
  const diff = G.difficulty==='hard'?1.5:1;
  G.happiness += (Math.random()-0.5)*4*diff + (G.economy>50?1:-1) + (G.corruption>40?-2:0) + (G.health>50?1:0) + (G.education>60?0.5:0);
  G.stability += (Math.random()-0.5)*3*diff + (G.happiness>50?0.5:-1) + (G.corruption>50?-1:0) + (G.military>50?0.3:0);
  G.corruption += (Math.random()-0.42)*2 + (G.activePolicies.includes('censorship')?0.5:0);
  G.environment += (Math.random()-0.55)*2 + (G.production>60?-1:0) + (G.activePolicies.includes('green')?0.5:0);
  G.economy += (Math.random()-0.5)*3 + (G.education>50?0.5:0) + (G.trade>50?0.5:0);
  G.research += (Math.random()-0.4)*2 + (G.education>50?0.5:0) + (G.activePolicies.includes('ai')?1:0);
  G.health += (Math.random()-0.5)*2 + (G.activePolicies.includes('healthcare')?0.5:0);
  G.education += (Math.random()-0.4)*1.5 + (G.activePolicies.includes('education')?0.5:0);
  G.diplomacy += (Math.random()-0.5)*2 + (G.allies>0?0.3:0);
  G.trade += (Math.random()-0.45)*1.5 + (G.aiNations.filter(n=>n.tradeAgreement).length*0.2);
  
  ['economy','happiness','stability','military','research','diplomacy','environment','health','education','corruption','equality','trade','production','energy','tourism','espionage'].forEach(k=>clampStat(k));
  
  // Approval formula
  G.approval = clamp(
    G.happiness * 0.32 +
    G.economy * 0.22 +
    G.stability * 0.15 +
    G.health * 0.10 +
    G.education * 0.10 +
    (100 - G.corruption) * 0.11
  );
  G.approvalHistory.push(G.approval);
  
  // AI Nations
  G.aiNations.forEach((n, idx) => {
    if(!n.atWar) {
      const personalityDrift = n.personality==='diplomatic'?1:n.personality==='peaceful'?0.5:0;
      const drift = (Math.random()-0.5)*5 + personalityDrift;
      n.relation = clamp(n.relation + drift);
      
      // AI declares war on very low relations
      if(n.personality==='aggressive' && Math.random()<0.04 && n.relation<20 && !G.warState) {
        n.atWar = true; n.alliance = false; n.tradeAgreement = false;
        G.warState = {enemy:idx, turns:0};
        toast('⚔️',`${n.name} declared war on you!`,'error');
        addLog('⚔️',`${n.name} declares war!`,G.year);
        addNews(`⚔️ BREAKING: ${n.name} launches surprise attack on ${G.name}!`);
        G.pendingEvent = null;
      }
    }
    n.strength += Math.floor((Math.random()-0.4)*3);
    n.strength = clamp(n.strength, 15, 98);
  });
  updateRelationLabels();
  
  // War resolution
  if(G.warState) {
    G.warState.turns++;
    const enemy = G.aiNations[G.warState.enemy];
    if(enemy && G.warState.turns >= 3) {
      const myPower = G.military * 1.2 + (G.hasNukes?25:0) + G.espionage * 0.3 + Math.random()*15;
      const enemyPower = enemy.strength * 1.2 + Math.random()*20;
      if(myPower > enemyPower) {
        enemy.atWar=false; enemy.relation=15;
        const spoils = 2000 + Math.floor(Math.random()*2000);
        G.treasury += spoils; G.warsWon++;
        G.warState=null;
        toast('🏆',`Victory! War spoils: ${fmtMoneyShort(spoils)}`,'success');
        addLog('🏆',`Victory over ${enemy.name}! Spoils collected`,G.year);
        addNews(`🏆 ${G.name} achieves decisive military victory over ${enemy.name}`);
      } else if(G.warState.turns >= 7) {
        enemy.atWar=false; enemy.relation=10;
        const losses = 1500 + Math.floor(Math.random()*1500);
        G.treasury -= losses; G.warsLost++;
        G.military = clamp(G.military - 12);
        G.happiness = clamp(G.happiness - 10);
        G.warState=null;
        toast('💀',`Defeated by ${enemy.name}. Losses: ${fmtMoneyShort(losses)}`,'error');
        addLog('💀',`Defeat against ${enemy.name}`,G.year);
      }
    }
    if(G.warState) {
      G.treasury -= 500; G.happiness = clamp(G.happiness-3); G.economy = clamp(G.economy-2);
    }
  }
  
  triggerRandomEvent();
  
  if(G.activePolicies.includes('nukes')) G.hasNukes = true;
  if(G.activePolicies.includes('space')) G.hasSpace = true;
  
  // Add periodic news
  if(G.year % 5 === 0) {
    addNews(`📊 Year ${G.year} economic report: GDP per capita $${fmt(G.gdpPerCapita)} · Treasury ${fmtMoneyShort(G.treasury)}`);
  }
  
  // Game over checks
  if(G.treasury < -15000) { gameOver(`${G.name} declared national bankruptcy. Total debt reached ${fmtMoneyShort(Math.abs(G.treasury))} — international creditors seize control.`, false); return; }
  if(G.stability < 4) { gameOver('Civil war erupts! Your government collapses under extreme political instability.', false); return; }
  if(G.happiness < 4) { gameOver('Revolution! The people rise up — your government is overthrown by popular uprising.', false); return; }
  if(G.approval < 4) { gameOver(`With a ${Math.round(G.approval)}% approval rating, ${G.leaderName} is removed from power by constitutional crisis.`, false); return; }
  if(G.year >= 200) { gameOver(`After ${G.year} years, ${G.name} stands as a timeless civilization — a wonder of the modern world.`, true); return; }
  
  checkAchievements();
}

function gameOver(reason, isWin) {
  G.gameOver = true;
  G.gameOverReason = reason;
  document.getElementById('gameScreen').classList.add('hidden-left');
  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('goIcon').textContent = isWin ? '🎉' : '💀';
  document.getElementById('goTitle').textContent = isWin ? 'Legendary Civilization!' : 'Nation Collapsed';
  document.getElementById('goReason').textContent = reason;
  document.getElementById('goStats').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin-top:16px;">
      <div class="stat-card gold"><div class="stat-label">Years Survived</div><div class="stat-value">${G.year}</div></div>
      <div class="stat-card blue"><div class="stat-label">Final Population</div><div class="stat-value">${fmt(G.population)}</div></div>
      <div class="stat-card green"><div class="stat-label">Peak GDP/Capita</div><div class="stat-value">$${fmt(Math.max(...G.gdpHistory))}</div></div>
      <div class="stat-card purple"><div class="stat-label">Achievements</div><div class="stat-value">${G.unlockedAchievements.length}/${ACHIEVEMENTS.length}</div></div>
      <div class="stat-card red"><div class="stat-label">Wars Won</div><div class="stat-value">${G.warsWon}</div></div>
      <div class="stat-card cyan"><div class="stat-label">Spy Missions</div><div class="stat-value">${G.spySuccesses}</div></div>
    </div>`;
}

// ---- ACHIEVEMENTS ----
function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if(!G.unlockedAchievements.includes(a.id) && a.check(G)) {
      G.unlockedAchievements.push(a.id);
      toast(a.icon, `Achievement Unlocked: ${a.name}!`, 'success');
      addLog(a.icon, `Achievement: ${a.name}`, G.year);
    }
  });
}

// ---- SHOW TREASURY DETAIL ----

  const net = G.treasuryIncome - G.treasuryExpense;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">💵 Treasury Detail</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
      <div class="stat-card gold"><div class="stat-label">Balance</div><div class="stat-value" style="font-size:17px;">${fmtMoneyShort(G.treasury)}</div></div>
      <div class="stat-card ${net>=0?'green':'red'}"><div class="stat-label">Net/Year</div><div class="stat-value" style="font-size:17px;">${net>=0?'+':''}${fmtMoneyShort(net)}</div></div>
    </div>
    <div class="info-row"><span class="info-label">📥 Annual Revenue</span><span class="info-val" style="color:#34d399;">+${fmtMoneyShort(G.treasuryIncome)}</span></div>
    <div class="info-row" style="padding-left:16px;"><span class="info-label" style="font-size:11px;">Income Tax</span><span class="info-val">${fmtMoneyShort(Math.floor(G.treasuryIncome*0.35))}</span></div>
    <div class="info-row" style="padding-left:16px;"><span class="info-label" style="font-size:11px;">Trade Revenue</span><span class="info-val">${fmtMoneyShort(Math.floor(G.treasuryIncome*0.25))}</span></div>
    <div class="info-row" style="padding-left:16px;"><span class="info-label" style="font-size:11px;">Corporate Tax</span><span class="info-val">${fmtMoneyShort(Math.floor(G.treasuryIncome*0.20))}</span></div>
    <div class="info-row" style="padding-left:16px;"><span class="info-label" style="font-size:11px;">Other Revenue</span><span class="info-val">${fmtMoneyShort(Math.floor(G.treasuryIncome*0.20))}</span></div>
    <div class="info-row"><span class="info-label">📤 Annual Expenditure</span><span class="info-val" style="color:#f87171;">-${fmtMoneyShort(G.treasuryExpense)}</span></div>
    <div class="info-row" style="padding-left:16px;"><span class="info-label" style="font-size:11px;">Defense Budget</span><span class="info-val">-${fmtMoneyShort(Math.floor(G.military*15*(G.population/1e6)*0.3))}</span></div>
    <div class="info-row" style="padding-left:16px;"><span class="info-label" style="font-size:11px;">Policy Costs</span><span class="info-val">-${fmtMoneyShort(G.activePolicies.reduce((s,id)=>{const p=findPolicy(id);return s+(p?p.annualCost||0:0);},0))}</span></div>
    <div class="info-row"><span class="info-label">📋 National Debt</span><span class="info-val" style="color:#fbbf24;">${fmtMoneyShort(G.totalDebt)}</span></div>
    <div class="info-row"><span class="info-label">📊 Debt/GDP Ratio</span><span class="info-val" style="color:${G.debtGdpRatio<60?'#34d399':G.debtGdpRatio<100?'var(--accent-gold)':'#f87171'}">${G.debtGdpRatio.toFixed(1)}%</span></div>
    <div class="event-choice" style="margin-top:12px;" onclick="emergencyLoan()">🏦 Apply for Emergency IMF Loan (+${fmtMoneyShort(5000)}) — Debt +${fmtMoneyShort(6000)}</div>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function emergencyLoan() {
  G.treasury += 5000;
  G.totalDebt += 6000;
  G.debtGdpRatio += 10;
  closeModal();
  toast('🏦', `IMF loan of ${fmtMoneyShort(5000)} received. Debt increased.`, 'warn');
  renderGame();
}

// ---- LOG / NOTIFICATIONS ----
function addLog(icon, text, year) {
  G.eventLog.unshift({ icon, text, year });
  if(G.eventLog.length > 50) G.eventLog.pop();
  G.newNotifications = true;
}

function addNews(text) {
  G.newsItems.push(text);
  if(G.newsItems.length > 20) G.newsItems.shift();
}

function showLog() {
  G.newNotifications = false;
  document.getElementById('logBadge').style.display = 'none';
  let h = `<div class="modal-title">📋 Event Log</div>`;
  if(G.eventLog.length===0) {
    h += `<div class="empty-state"><div class="empty-icon">📋</div>No events recorded yet.</div>`;
  } else {
    G.eventLog.slice(0,30).forEach(e=>{
      h += `<div class="log-item">
        <span class="log-icon">${e.icon}</span>
        <span class="log-text">${e.text}</span>
        <span class="log-year">Yr ${e.year}</span>
      </div>`;
    });
  }
  document.getElementById('modalContent').innerHTML = h;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

// ---- ACHIEVEMENTS MODAL ----
function showAchievements() {
  const pct = Math.round((G.unlockedAchievements.length/ACHIEVEMENTS.length)*100);
  let h = `
    <div class="modal-title">🏆 Achievements — ${G.unlockedAchievements.length}/${ACHIEVEMENTS.length}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <div style="flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent-gold),#c97a00);border-radius:3px;transition:width 0.5s;"></div>
      </div>
      <span style="font-size:12px;font-weight:700;color:var(--accent-gold);font-family:'Space Mono',monospace;">${pct}%</span>
    </div>`;
  ACHIEVEMENTS.forEach(a => {
    const unlocked = G.unlockedAchievements.includes(a.id);
    h += `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);${unlocked?'':'opacity:0.3;'}">
      <div style="font-size:24px;width:36px;text-align:center;">${a.icon}</div>
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:700;">${a.name}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:1px;">${a.desc}</div>
      </div>
      <div style="font-size:14px;">${unlocked?'✅':'🔒'}</div>
    </div>`;
  });
  document.getElementById('modalContent').innerHTML = h;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function showSettings() {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">⚙️ Settings</div>
    <div style="color:var(--text-muted);font-size:12px;margin-bottom:16px;">${G.name} · Year ${G.year} · ${getEra()} · Difficulty: ${G.difficulty.toUpperCase()}</div>
    <div class="info-row"><span class="info-label">Leader</span><span class="info-val">${G.leaderName}</span></div>
    <div class="info-row"><span class="info-label">Trait</span><span class="info-val">${(LEADER_TRAITS.find(t=>t.id===G.leaderTrait)||{}).name||'-'}</span></div>
    <div class="info-row"><span class="info-label">Government</span><span class="info-val">${(GOVTS.find(g=>g.id===G.govt)||{}).name}</span></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
      <div class="event-choice" onclick="if(confirm('Start a new game? All progress will be lost.'))location.reload();">🔄 New Game</div>
      <div class="event-choice" onclick="closeModal()">❌ Close</div>
    </div>
    <div style="margin-top:24px;text-align:center;font-size:10px;color:var(--text-muted);letter-spacing:1px;">NATIONFORGE v2.0 · ENHANCED EDITION</div>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

// ---- MODAL ----
function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

// ---- TOASTS ----
function toast(icon, msg, type='') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type?'toast-'+type:''}`;
  el.innerHTML = `<span class="toast-icon">${icon}</span><span class="toast-msg">${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

document.addEventListener('DOMContentLoaded', () => {
  selectedGovt = 'democracy';
  selectedCont = 'as';
  selectedDiff = 'normal';
  document.getElementById('nationNameInput').value = '';
  document.getElementById('flagInput').value = '🇮🇳';
  document.getElementById('leaderInput').value = '';
});
