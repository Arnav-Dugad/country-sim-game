<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>NationForge — Country Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary:#080c18;--bg-secondary:#0d1424;--bg-card:#131c2e;--bg-card-hover:#182236;
  --bg-glass:rgba(19,28,46,0.7);--accent-gold:#f0b429;--accent-gold-dim:rgba(240,180,41,0.12);
  --accent-gold-glow:rgba(240,180,41,0.25);--accent-blue:#3b82f6;--accent-blue-dim:rgba(59,130,246,0.12);
  --accent-green:#10b981;--accent-green-dim:rgba(16,185,129,0.12);--accent-red:#ef4444;
  --accent-red-dim:rgba(239,68,68,0.12);--accent-purple:#8b5cf6;--accent-purple-dim:rgba(139,92,246,0.12);
  --accent-cyan:#06b6d4;--accent-cyan-dim:rgba(6,182,212,0.12);--accent-orange:#f97316;
  --accent-orange-dim:rgba(249,115,22,0.12);--text-primary:#f1f5f9;--text-secondary:#8899b4;
  --text-muted:#4a5a72;--border:rgba(255,255,255,0.05);--border-light:rgba(255,255,255,0.09);
  --shadow-heavy:0 20px 60px rgba(0,0,0,0.6);--shadow-card:0 4px 24px rgba(0,0,0,0.35);
  --radius:16px;--radius-sm:12px;--radius-xs:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg-primary);color:var(--text-primary);touch-action:manipulation;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");opacity:0.4;}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;overflow:hidden;z-index:1;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform 0.45s cubic-bezier(0.16,1,0.3,1),opacity 0.4s ease;will-change:transform,opacity;}
.screen.hidden{transform:translateX(100%);opacity:0;pointer-events:none;}
.screen.hidden-left{transform:translateX(-25%);opacity:0;pointer-events:none;}

/* SPLASH */
#splashScreen{background:#080c18;align-items:center;justify-content:center;gap:20px;z-index:100;overflow:hidden;}
.orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.35;animation:orbDrift 12s ease-in-out infinite;}
.orb:nth-child(1){width:300px;height:300px;background:radial-gradient(circle,#f0b429,transparent);top:-80px;left:-80px;animation-delay:0s;}
.orb:nth-child(2){width:250px;height:250px;background:radial-gradient(circle,#3b82f6,transparent);bottom:-60px;right:-60px;animation-delay:-4s;}
.orb:nth-child(3){width:200px;height:200px;background:radial-gradient(circle,#8b5cf6,transparent);bottom:30%;left:20%;animation-delay:-8s;}
@keyframes orbDrift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(20px,-15px) scale(1.05);}66%{transform:translate(-15px,10px) scale(0.97);}}
#splashScreen .logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
#splashScreen .logo-ring{position:absolute;width:128px;height:128px;border-radius:50%;border:1px solid var(--accent-gold-glow);animation:ringPulse 2.5s ease-in-out infinite;}
#splashScreen .logo-ring2{position:absolute;width:160px;height:160px;border-radius:50%;border:1px solid rgba(240,180,41,0.1);animation:ringPulse 2.5s ease-in-out infinite 0.4s;}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:0.5;}50%{transform:scale(1.06);opacity:1;}}
#splashScreen .logo-icon{width:96px;height:96px;background:linear-gradient(145deg,#f0b429 0%,#c97a00 60%,#f0b429 100%);border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 0 0 1px rgba(240,180,41,0.3),0 8px 32px rgba(240,180,41,0.35),0 2px 8px rgba(0,0,0,0.5);position:relative;z-index:1;animation:logoPulse 3s ease-in-out infinite;}
@keyframes logoPulse{0%,100%{box-shadow:0 0 0 1px rgba(240,180,41,0.3),0 8px 32px rgba(240,180,41,0.35),0 2px 8px rgba(0,0,0,0.5);}50%{box-shadow:0 0 0 1px rgba(240,180,41,0.5),0 12px 48px rgba(240,180,41,0.5),0 2px 8px rgba(0,0,0,0.5);}}
#splashScreen h1{font-family:'Syne',sans-serif;font-size:40px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(135deg,#fff 20%,var(--accent-gold) 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#splashScreen .tagline{color:var(--text-muted);font-size:11px;font-weight:500;letter-spacing:4px;text-transform:uppercase;}
#splashScreen .version-tag{font-size:9px;color:var(--text-muted);letter-spacing:2px;position:absolute;bottom:24px;}
.splash-features{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:280px;margin-top:6px;}
.splash-feature{padding:4px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--text-muted);}
.start-btn{margin-top:30px;padding:15px 52px;background:linear-gradient(135deg,#f0b429,#c97a00);border:none;border-radius:50px;color:#000;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.25s ease;box-shadow:0 4px 20px rgba(240,180,41,0.4),0 1px 0 rgba(255,255,255,0.2) inset;position:relative;z-index:1;}
.start-btn:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(240,180,41,0.5);}
.start-btn:active{transform:scale(0.97) translateY(1px);}

/* SETUP */
#setupScreen{background:var(--bg-primary);overflow-y:auto;padding:20px;}
.setup-header{text-align:center;padding:28px 0 20px;}
.setup-header h2{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;}
.setup-header p{color:var(--text-secondary);font-size:13px;margin-top:6px;}
.setup-section{margin-bottom:22px;}
.setup-section label{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
.setup-input{width:100%;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-sm);color:var(--text-primary);font-family:inherit;font-size:16px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.2) inset;}
.setup-input:focus{border-color:var(--accent-gold);box-shadow:0 0 0 3px var(--accent-gold-dim);}
.setup-input::placeholder{color:var(--text-muted);}
.govt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.govt-option{padding:14px 10px;background:var(--bg-card);border:1.5px solid var(--border-light);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:all 0.2s;}
.govt-option:active{transform:scale(0.97);}
.govt-option.selected{border-color:var(--accent-gold);background:linear-gradient(145deg,rgba(240,180,41,0.12),rgba(240,180,41,0.05));box-shadow:0 0 0 1px rgba(240,180,41,0.2),0 4px 16px rgba(240,180,41,0.1);}
.govt-option .govt-icon{font-size:28px;margin-bottom:5px;}
.govt-option .govt-name{font-size:12px;font-weight:700;}
.govt-option .govt-desc{font-size:10px;color:var(--text-muted);margin-top:2px;}
.continent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.continent-option{padding:12px 6px;background:var(--bg-card);border:1.5px solid var(--border-light);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:all 0.2s;}
.continent-option:active{transform:scale(0.97);}
.continent-option.selected{border-color:var(--accent-blue);background:var(--accent-blue-dim);box-shadow:0 0 0 1px rgba(59,130,246,0.2);}
.continent-option .cont-icon{font-size:22px;}
.continent-option .cont-name{font-size:10px;font-weight:700;margin-top:4px;color:var(--text-secondary);}
.diff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.diff-option{padding:14px 8px;background:var(--bg-card);border:1.5px solid var(--border-light);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:all 0.2s;}
.diff-option:active{transform:scale(0.97);}
.diff-option.selected{border-color:var(--accent-green);background:var(--accent-green-dim);box-shadow:0 0 0 1px rgba(16,185,129,0.2);}
.diff-option .diff-icon{font-size:22px;}
.diff-option .diff-name{font-size:11px;font-weight:700;margin-top:4px;}
.begin-btn{width:100%;padding:16px;margin-top:20px;margin-bottom:40px;background:linear-gradient(135deg,#f0b429,#c97a00);border:none;border-radius:var(--radius-sm);color:#000;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase;box-shadow:0 4px 20px rgba(240,180,41,0.35);transition:all 0.25s;}
.begin-btn:hover{box-shadow:0 6px 28px rgba(240,180,41,0.5);}
.begin-btn:active{transform:scale(0.98);}

/* GAME */
#gameScreen{background:var(--bg-primary);}
.alert-pulse{animation:alertPulse 1.2s ease-in-out infinite;}
@keyframes alertPulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,var(--bg-secondary) 0%,rgba(13,20,36,0.95) 100%);border-bottom:1px solid var(--border);position:relative;z-index:10;backdrop-filter:blur(12px);}
.top-bar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,0.2),transparent);}
.top-bar .nation-info{display:flex;align-items:center;gap:8px;}
.nation-flag{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;background:linear-gradient(145deg,rgba(240,180,41,0.15),rgba(240,180,41,0.05));border:1px solid rgba(240,180,41,0.2);box-shadow:0 2px 8px rgba(0,0,0,0.3);}
.nation-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;letter-spacing:-0.3px;}
.nation-year{font-size:9px;color:var(--text-muted);font-family:'Space Mono',monospace;margin-top:1px;}
.top-actions{display:flex;gap:5px;align-items:center;}
.top-btn{width:32px;height:32px;border-radius:9px;background:var(--bg-card);border:1px solid var(--border-light);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all 0.2s;position:relative;}
.top-btn:hover{background:var(--bg-card-hover);border-color:rgba(255,255,255,0.15);}
.top-btn:active{transform:scale(0.93);}
.notif-badge{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--accent-red);font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#fff;border:1.5px solid var(--bg-secondary);}
.prestige-chip{display:flex;align-items:center;gap:4px;padding:4px 8px;background:rgba(240,180,41,0.08);border:1px solid rgba(240,180,41,0.2);border-radius:12px;cursor:pointer;}
.prestige-chip .p-icon{font-size:10px;}
.prestige-chip .p-val{font-size:10px;font-weight:800;font-family:'Space Mono',monospace;color:var(--accent-gold);}
.news-ticker{background:rgba(240,180,41,0.06);border-bottom:1px solid rgba(240,180,41,0.12);padding:5px 0;overflow:hidden;position:relative;height:24px;}
.news-ticker-inner{display:flex;align-items:center;white-space:nowrap;animation:tickerScroll 40s linear infinite;font-size:10px;color:rgba(240,180,41,0.7);font-weight:600;letter-spacing:0.3px;padding-left:100%;}
@keyframes tickerScroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.ticker-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--accent-gold);margin:0 10px;opacity:0.5;vertical-align:middle;}
.resource-bar{display:flex;gap:4px;padding:6px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.resource-bar::-webkit-scrollbar{display:none;}
.res-chip{display:flex;align-items:center;gap:4px;padding:4px 9px;background:rgba(255,255,255,0.03);border:1px solid var(--border-light);border-radius:20px;white-space:nowrap;flex-shrink:0;transition:all 0.2s;}
.res-chip .res-icon{font-size:10px;}
.res-chip .res-val{font-size:10px;font-weight:700;font-family:'Space Mono',monospace;}
.res-chip .res-delta{font-size:8px;font-weight:700;margin-left:1px;}
.res-chip.positive .res-val{color:#34d399;}
.res-chip.negative .res-val{color:#f87171;}
.res-chip.neutral .res-val{color:var(--text-secondary);}
.res-chip.critical{border-color:rgba(239,68,68,0.4);animation:alertPulse 1.2s ease-in-out infinite;}
.leader-bar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:rgba(255,255,255,0.015);border-bottom:1px solid var(--border);}
.leader-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;border:1.5px solid rgba(139,92,246,0.3);}
.leader-info{flex:1;min-width:0;}
.leader-name{font-size:11px;font-weight:700;}
.leader-trait{font-size:9px;color:var(--text-muted);}
.leader-approval{font-size:11px;font-weight:800;font-family:'Space Mono',monospace;}
.election-badge{font-size:9px;font-weight:800;letter-spacing:0.5px;padding:2px 7px;border-radius:5px;background:rgba(240,180,41,0.12);color:var(--accent-gold);border:1px solid rgba(240,180,41,0.2);flex-shrink:0;}
.game-content{flex:1;overflow-y:auto;padding:12px;padding-bottom:110px;scroll-behavior:smooth;}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-card{background:linear-gradient(145deg,var(--bg-card),rgba(13,20,36,0.8));border-radius:var(--radius-sm);padding:13px;border:1px solid var(--border);position:relative;overflow:hidden;box-shadow:var(--shadow-card);transition:transform 0.2s,border-color 0.2s;cursor:pointer;}
.stat-card:active{transform:scale(0.97);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0;}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(255,255,255,0.02) 0%,transparent 60%);pointer-events:none;}
.stat-card.gold::before{background:linear-gradient(90deg,var(--accent-gold),#c97a00);}
.stat-card.blue::before{background:linear-gradient(90deg,var(--accent-blue),#1d4ed8);}
.stat-card.green::before{background:linear-gradient(90deg,var(--accent-green),#059669);}
.stat-card.red::before{background:linear-gradient(90deg,var(--accent-red),#dc2626);}
.stat-card.purple::before{background:linear-gradient(90deg,var(--accent-purple),#7c3aed);}
.stat-card.cyan::before{background:linear-gradient(90deg,var(--accent-cyan),#0891b2);}
.stat-card.orange::before{background:linear-gradient(90deg,var(--accent-orange),#c2410c);}
.stat-card .stat-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;}
.stat-card .stat-value{font-size:18px;font-weight:800;margin-top:3px;font-family:'Space Mono',monospace;}
.stat-card .stat-change{font-size:10px;margin-top:3px;font-weight:600;}
.stat-card .stat-change.up{color:var(--accent-green);}
.stat-card .stat-change.down{color:var(--accent-red);}
.stat-card .stat-mini{position:absolute;bottom:8px;right:10px;opacity:0.2;font-size:26px;}
.approval-section{background:linear-gradient(145deg,var(--bg-card),rgba(13,20,36,0.7));border-radius:var(--radius);padding:15px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
.approval-section::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;background:radial-gradient(circle,rgba(240,180,41,0.06) 0%,transparent 70%);}
.approval-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.approval-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.approval-pct{font-size:22px;font-weight:800;font-family:'Space Mono',monospace;}
.approval-bar-track{height:6px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.3) inset;}
.approval-bar-fill{height:100%;border-radius:3px;transition:width 0.7s cubic-bezier(0.16,1,0.3,1),background 0.4s ease;position:relative;}
.approval-bar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:6px;background:rgba(255,255,255,0.4);border-radius:50%;filter:blur(2px);}
.approval-factors{display:flex;gap:5px;flex-wrap:wrap;}
.factor-tag{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;border:1px solid transparent;}
.sector-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding:2px 0;}
.sector-tabs::-webkit-scrollbar{display:none;}
.sector-tab{padding:7px 12px;border-radius:20px;background:var(--bg-card);border:1px solid var(--border-light);white-space:nowrap;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;transition:all 0.2s;display:flex;align-items:center;gap:5px;color:var(--text-secondary);}
.sector-tab:active{transform:scale(0.96);}
.sector-tab.active{background:var(--accent-gold);color:#000;border-color:var(--accent-gold);box-shadow:0 2px 12px rgba(240,180,41,0.35);font-weight:700;}
.sector-content{background:linear-gradient(145deg,var(--bg-card),rgba(13,20,36,0.7));border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow-card);}
.sector-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.015);}
.sector-header h3{font-size:13px;font-weight:700;letter-spacing:-0.2px;}
.sector-body{padding:14px;}
.policy-card{background:rgba(255,255,255,0.02);border-radius:var(--radius-xs);padding:12px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.policy-card:hover{background:rgba(255,255,255,0.04);border-color:var(--border-light);}
.policy-card:active{transform:scale(0.985);}
.policy-card.active-policy{border-color:rgba(16,185,129,0.25);background:rgba(16,185,129,0.03);}
.policy-card .policy-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.policy-card .policy-name{font-size:13px;font-weight:700;}
.policy-card .policy-cost{font-size:10px;font-weight:700;font-family:'Space Mono',monospace;padding:3px 8px;border-radius:8px;}
.policy-card .policy-desc{font-size:11px;color:var(--text-secondary);line-height:1.5;}
.policy-card .policy-effects{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.policy-effect{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;}
.policy-effect.positive{background:rgba(16,185,129,0.12);color:#34d399;border:1px solid rgba(16,185,129,0.2);}
.policy-effect.negative{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.2);}
.policy-card .annual-cost{font-size:9px;color:var(--text-muted);margin-top:5px;display:flex;align-items:center;gap:4px;}
.build-card{display:flex;gap:12px;padding:12px;background:rgba(255,255,255,0.02);border-radius:var(--radius-xs);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all 0.2s;}
.build-card:hover{background:rgba(255,255,255,0.04);}
.build-card:active{transform:scale(0.985);}
.build-card .build-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.build-card .build-info{flex:1;min-width:0;}
.build-card .build-name{font-size:13px;font-weight:700;}
.build-card .build-desc{font-size:10px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
.build-card .build-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.build-card .build-cost{font-size:11px;font-weight:700;font-family:'Space Mono',monospace;color:var(--accent-gold);}

.event-card.opportunity::before{background:linear-gradient(180deg,var(--accent-green),#065f46);}

.event-card.diplomacy::before{background:linear-gradient(180deg,var(--accent-blue),#1e40af);}
.event-card.diplomacy::after{background:var(--accent-blue);}

.event-card.election::before{background:linear-gradient(180deg,var(--accent-gold),#c97a00);}

.event-card .event-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}

.event-card.crisis .event-type{color:#f87171;}
.event-card.opportunity .event-type{color:#34d399;}
.event-card.diplomacy .event-type{color:#60a5fa;}
.event-card.election .event-type{color:var(--accent-gold);}
.event-card.disaster .event-type{color:#fb923c;}
.event-card .event-title{font-size:15px;font-weight:800;margin-bottom:6px;font-family:'Syne',sans-serif;}

.event-choice:active{background:var(--accent-gold-dim);border-color:rgba(240,180,41,0.3);transform:scale(0.98);}
.event-choice .choice-cost{font-family:'Space Mono',monospace;font-size:10px;color:var(--accent-gold);float:right;}

.choice-tag.neg{background:rgba(239,68,68,0.15);color:#f87171;}
.diplo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.diplo-card .diplo-name{font-size:12px;font-weight:700;margin-top:6px;}

.diplo-card .diplo-relation.neutral{background:rgba(240,180,41,0.12);color:var(--accent-gold);border:1px solid rgba(240,180,41,0.2);}

.mil-stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.mil-stat:last-child{border-bottom:none;}
.mil-stat .mil-label{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;}
.mil-stat .mil-val{font-size:13px;font-weight:700;font-family:'Space Mono',monospace;}
.progress-row{margin-bottom:11px;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;}

.progress-track{height:5px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;position:relative;}

.progress-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:rgba(255,255,255,0.5);border-radius:50%;filter:blur(1px);}
.turn-section{position:absolute;bottom:62px;left:12px;right:12px;z-index:20;}
.next-turn-btn{width:100%;padding:13px;background:linear-gradient(135deg,#f0b429,#c97a00);border:none;border-radius:var(--radius-sm);color:#000;font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 20px rgba(240,180,41,0.35),0 1px 0 rgba(255,255,255,0.2) inset;transition:all 0.2s;text-transform:uppercase;position:relative;overflow:hidden;}

.bottom-nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(13,20,36,0.97);backdrop-filter:blur(16px);border-top:1px solid var(--border);z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(240,180,41,0.1),transparent);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 4px 5px;cursor:pointer;transition:all 0.2s;color:var(--text-muted);font-size:8px;gap:3px;position:relative;}
.nav-item::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--accent-gold);border-radius:0 0 2px 2px;transition:width 0.3s cubic-bezier(0.16,1,0.3,1);}
.nav-item.active{color:var(--accent-gold);}
.nav-item.active::before{width:24px;}
.nav-item .nav-icon{font-size:17px;}
.nav-item .nav-label{font-weight:700;letter-spacing:0.3px;text-transform:uppercase;}
.nav-alert{position:absolute;top:4px;right:calc(50% - 14px);width:7px;height:7px;border-radius:50%;background:var(--accent-red);border:1.5px solid var(--bg-secondary);animation:alertPulse 1.2s ease-in-out infinite;}
.modal-overlay{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;transition:opacity 0.3s;}
.modal-overlay.hidden{opacity:0;pointer-events:none;}
.modal-sheet{width:100%;max-height:90vh;background:var(--bg-secondary);border-radius:22px 22px 0 0;border:1px solid var(--border-light);border-bottom:none;padding:20px;overflow-y:auto;transform:translateY(0);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);box-shadow:0 -8px 40px rgba(0,0,0,0.5);}
.modal-overlay.hidden .modal-sheet{transform:translateY(100%);}
.modal-handle{width:36px;height:3px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-0.5px;}
.modal-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px;}
.toast-container{position:absolute;top:72px;left:12px;right:12px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{padding:11px 14px;border-radius:var(--radius-xs);background:rgba(19,28,46,0.97);border:1px solid var(--border-light);display:flex;align-items:center;gap:8px;animation:toastIn 0.35s cubic-bezier(0.16,1,0.3,1),toastOut 0.3s ease 2.7s forwards;box-shadow:0 8px 24px rgba(0,0,0,0.5);backdrop-filter:blur(12px);}
@keyframes toastIn{from{transform:translateY(-16px) scale(0.95);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
@keyframes toastOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-8px);}}
.toast .toast-icon{font-size:16px;}
.toast .toast-msg{font-size:12px;font-weight:600;color:var(--text-primary);flex:1;}
.toast.toast-success{border-color:rgba(16,185,129,0.3);}
.toast.toast-error{border-color:rgba(239,68,68,0.3);}
.toast.toast-warn{border-color:rgba(240,180,41,0.3);}
.turn-overlay{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity 0.4s;backdrop-filter:blur(8px);}
.turn-overlay.hidden{opacity:0;pointer-events:none;}
.turn-overlay .turn-year{font-size:52px;font-weight:900;font-family:'Syne',sans-serif;background:linear-gradient(135deg,var(--accent-gold) 0%,#fff 60%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:turnPop 0.5s cubic-bezier(0.34,1.56,0.64,1);letter-spacing:-2px;}
.turn-overlay .turn-label{color:var(--text-muted);font-size:12px;letter-spacing:3px;text-transform:uppercase;}

.turn-overlay .turn-item{font-size:12px;font-weight:600;}
.turn-overlay .turn-dots{display:flex;gap:6px;margin-top:14px;}
.turn-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-gold);opacity:0.3;animation:dotPulse 1.2s ease-in-out infinite;}
.turn-dot:nth-child(2){animation-delay:0.2s;}.turn-dot:nth-child(3){animation-delay:0.4s;}
@keyframes dotPulse{0%,100%{opacity:0.3;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
@keyframes turnPop{from{transform:scale(0.4);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ---- NEW FEATURES CSS ---- */
/* Star particles on splash */
.star-particle{position:absolute;width:var(--sz,2px);height:var(--sz,2px);background:#fff;border-radius:50%;pointer-events:none;opacity:0;animation:starTwinkle var(--dur,4s) ease-in-out var(--del,0s) infinite;}

.mood-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:800;flex-shrink:0;letter-spacing:0.3px;}

.pl-delta{font-size:8px;font-weight:800;padding:1px 4px;border-radius:4px;margin-left:3px;vertical-align:middle;display:inline-block;}
.pl-delta.up{background:rgba(16,185,129,0.15);color:#34d399;}
.pl-delta.down{background:rgba(239,68,68,0.15);color:#f87171;}

.research-widget{display:flex;gap:12px;align-items:center;background:linear-gradient(145deg,rgba(139,92,246,0.1),rgba(139,92,246,0.03));border:1px solid rgba(139,92,246,0.25);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden;}

.rw-name{font-size:12px;font-weight:700;margin-bottom:5px;color:var(--text-primary);}
.rw-bar-track{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.rw-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-purple),#a855f7);border-radius:3px;transition:width 0.8s cubic-bezier(0.16,1,0.3,1);position:relative;}
.rw-bar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:rgba(255,255,255,0.5);filter:blur(1px);}
.rw-meta{font-size:9px;color:var(--text-muted);font-weight:700;margin-top:4px;}.rw-pct{font-size:15px;font-weight:900;font-family:'Space Mono',monospace;color:var(--accent-purple);flex-shrink:0;}
/* War battle strength bar */
.battle-strength-bar{margin:10px 0;}
.bsb-labels{display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin-bottom:5px;}
.bsb-track{height:10px;background:rgba(255,255,255,0.04);border-radius:5px;overflow:hidden;display:flex;border:1px solid rgba(255,255,255,0.05);}
.bsb-player{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:5px 0 0 5px;transition:width 1.2s cubic-bezier(0.16,1,0.3,1);position:relative;}
.bsb-player::after{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:rgba(255,255,255,0.5);filter:blur(1px);}
.bsb-enemy{height:100%;background:linear-gradient(90deg,#ef4444,#dc2626);border-radius:0 5px 5px 0;}
/* Approval sparkline */
.mini-chart-wrap{height:40px;position:relative;}
.mini-chart-wrap canvas{width:100%;height:100%;}
/* Top bar war glow */

function clamp(v,min=0,max=100){return Math.max(min,Math.min(max,v));}
function clampStat(k){if(k==='treasury'||k==='totalDebt'||k==='population'||k==='gdpPerCapita')return;G[k]=clamp(G[k]);}

function initState(name,flag,govt,cont,diff,leaderName){
  const dm={easy:1.4,normal:1,hard:0.65};
  const m=dm[diff];
  const gm=GOVTS.find(g=>g.id===govt).modifiers;
  const trait=LEADER_TRAITS[Math.floor(Math.random()*LEADER_TRAITS.length)];
  G={
    name,flag,govt,continent:cont,difficulty:diff,year:1,
    leaderName,leaderTrait:trait.id,
    electionYear:govt==='democracy'?4:9999,
    population:Math.floor(8000000*m),populationGrowth:2.1,
    gdpPerCapita:Math.floor(14000*m),
    treasury:Math.floor(8000*m),
    treasuryIncome:Math.floor(1200*m),treasuryExpense:Math.floor(750*m),
    totalDebt:Math.floor(12000*m),debtGdpRatio:55,
    budgetMilitary:20,budgetHealth:20,budgetEducation:15,budgetInfra:20,budgetWelfare:15,budgetResearch:10,
    economy:clamp(50+(gm.economy||0)+(trait.modifiers.economy||0)),
    happiness:clamp(55+(gm.happiness||0)+(trait.modifiers.happiness||0)),
    stability:clamp(60+(gm.stability||0)+(trait.modifiers.stability||0)),
    military:clamp(30+(gm.military||0)+(trait.modifiers.military||0)),
    research:clamp(20+(gm.research||0)+(trait.modifiers.research||0)),
    diplomacy:clamp(50+(gm.diplomacy||0)+(trait.modifiers.diplomacy||0)),
    environment:clamp(70+(trait.modifiers.environment||0)),
    health:clamp(50),education:clamp(40+(gm.research||0)),
    corruption:clamp(25+(gm.corruption||0)+(trait.modifiers.corruption||0)),
    equality:clamp(50+(gm.equality||0)),trade:clamp(40),
    production:clamp(45+(trait.modifiers.production||0)),energy:clamp(40),
    tourism:20,espionage:clamp(10+(trait.modifiers.espionage||0)),
    approval:55,prestige:0,
    activePolicies:[],researchedTechs:[],activeTech:null,
    policiesEnacted:0,warsWon:0,warsLost:0,hasNukes:false,hasSpace:false,
    allies:0,spySuccesses:0,disastersSurvived:0,
    gdpHistory:[Math.floor(14000*m)],treasuryHistory:[Math.floor(8000*m)],approvalHistory:[55],
    unlockedAchievements:[],eventLog:[],pendingEvent:null,lastEventId:null,
    aiNations:AI_NATIONS.map(n=>({...n,relation:Math.floor(Math.random()*40)+30,relationLabel:'neutral',tradeAgreement:false,alliance:false,atWar:false})),
    warState:null,gameOver:false,victoriesAchieved:[],
    newsItems:[
      '📰 '+name+' founded — the nation begins its journey to greatness',
      '🌟 Leader '+leaderName+' takes office with broad popular support',
      '📊 GDP per capita stands at $'+fmt(Math.floor(14000*m))+' at founding',
    ],
    newNotifications:false,
    prevStats:null,
    currentEra:'Foundation Era',
  };
  updateRelationLabels();
}

function fmtMoney(n){const a=Math.abs(n),s=n<0?'-':'';if(a>=1e9)return s+'$'+(a/1e9).toFixed(2)+'T';if(a>=1e3)return s+'$'+(a/1e3).toFixed(1)+'B';return s+'$'+a.toFixed(0)+'M';}
function fmtMoneyShort(n){const a=Math.abs(n),s=n<0?'-':'';if(a>=1e9)return s+'$'+(a/1e9).toFixed(1)+'T';if(a>=1e3)return s+'$'+(a/1e3).toFixed(1)+'B';return s+'$'+a.toFixed(0)+'M';}
function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'K';return String(n);}
function calcPrestige(){return Math.floor(G.economy*2+G.happiness*2+G.military*1.5+G.research*2+G.diplomacy*1.5+G.health*1+G.education*1+G.environment*0.5+G.equality*0.5+(100-G.corruption)*1+G.trade*1+G.warsWon*50+G.allies*30+G.spySuccesses*10+G.unlockedAchievements.length*25+G.researchedTechs.length*40+Math.floor(G.population/1000000)*5+G.year*3);}
function getPrestigeRank(p){if(p<500)return'Emerging State';if(p<1500)return'Regional Power';if(p<3000)return'Major Power';if(p<6000)return'Great Power';if(p<10000)return'Superpower';return'World Hegemon';}
function getGdpTotal(){return Math.floor(G.gdpPerCapita*G.population/1e6);}
function getEra(){if(G.year<10)return'Foundation Era';if(G.year<25)return'Growth Era';if(G.year<50)return'Industrial Era';if(G.year<75)return'Modern Era';if(G.year<100)return'Information Age';return'Space Age';}

// ---- SAVE / LOAD / EXPORT / IMPORT ----
const SAVE_KEY='nationforge_v31_save';
function autoSave(){
  if(!G||!G.name)return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:'3.1',ts:Date.now(),state:G}));}catch(e){}
}
function saveGame(){
  autoSave();
  toast('💾','Game saved to browser!','success');
  updateContinueBtn();
}
function loadGame(silent){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){if(!silent)toast('❌','No save found.','error');return false;}
    const data=JSON.parse(raw);
    if(!data.state){if(!silent)toast('❌','Corrupted save.','error');return false;}
    G=data.state;updateRelationLabels();
    if(!silent){
      closeModal();
      document.getElementById('splashScreen').classList.add('hidden-left');
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('setupScreen').classList.remove('hidden-left');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('gameScreen').classList.remove('hidden-left');
      _processingTurn=false;renderGame();
      toast('📂','Game loaded! Year '+G.year,'success');
    }
    return true;
  }catch(e){if(!silent)toast('❌','Load failed.','error');return false;}
}
function exportSave(){
  if(!G||!G.name){toast('❌','Start a game first.','error');return;}
  try{
    const saveData=JSON.stringify({v:'3.1',ts:Date.now(),state:G},null,2);
    const blob=new Blob([saveData],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    a.download=(G.name||'NationForge').replace(/[^a-z0-9]/gi,'_')+'_yr'+G.year+'_save.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);toast('📤','Save exported!','success');
  }catch(e){toast('❌','Export failed.','error');}
}
function importSave(){document.getElementById('importFileInput').click();}
function handleImport(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.state){toast('❌','Invalid save file.','error');return;}
      G=data.state;updateRelationLabels();closeModal();
      document.getElementById('splashScreen').classList.add('hidden-left');
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('setupScreen').classList.remove('hidden-left');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('gameScreen').classList.remove('hidden-left');
      _processingTurn=false;renderGame();
      toast('📂','Save imported! Welcome back, '+G.name+'!','success');
      autoSave();updateContinueBtn();
    }catch(err){toast('❌','Import failed — invalid file.','error');}
  };
  reader.readAsText(file);
}
function updateContinueBtn(){
  const btn=document.getElementById('continueBtn');
  if(!btn)return;
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){
    try{
      const data=JSON.parse(raw);
      if(data.state&&data.state.name){
        const ts=new Date(data.ts);
        const d=ts.toLocaleDateString('en',{month:'short',day:'numeric'});
        btn.textContent='▶ Continue — '+data.state.name+' · Yr '+data.state.year+' ('+d+')';
        btn.style.display='';return;
      }
    }catch(e){}
  }
  btn.style.display='none';
}

// ---- SETUP ----
function showSetup(){
  // Slide splash off-screen (works whether it's currently visible or already hidden)
  document.getElementById('splashScreen').classList.add('hidden-left');
  // Hide game screen (needed when called from in-game settings "New Game")
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden-left');
  // Hide game over screen
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.remove('hidden-left');
  // Show setup screen — must remove BOTH hidden classes so it slides in correctly
  document.getElementById('setupScreen').classList.remove('hidden');
  document.getElementById('setupScreen').classList.remove('hidden-left');
  // Reset turn lock in case a turn was mid-processing
  _processingTurn=false;
  // Reset selections
  selectedGovt='democracy';selectedCont='as';selectedDiff='normal';
  document.getElementById('nationNameInput').value='';
  document.getElementById('flagInput').value='🇮🇳';
  document.getElementById('leaderInput').value='';
  renderSetup();
}
function renderSetup(){
  let gh='';GOVTS.forEach(g=>{gh+=`<div class="govt-option ${selectedGovt===g.id?'selected':''}" onclick="selectGovt('${g.id}')"><div class="govt-icon">${g.icon}</div><div class="govt-name">${g.name}</div><div class="govt-desc">${g.desc}</div></div>`;});
  document.getElementById('govtGrid').innerHTML=gh;
  let ch='';CONTINENTS.forEach(c=>{ch+=`<div class="continent-option ${selectedCont===c.id?'selected':''}" onclick="selectCont('${c.id}')"><div class="cont-icon">${c.icon}</div><div class="cont-name">${c.name}</div></div>`;});
  document.getElementById('contGrid').innerHTML=ch;
  let dh='';DIFFICULTIES.forEach(d=>{dh+=`<div class="diff-option ${selectedDiff===d.id?'selected':''}" onclick="selectDiff('${d.id}')"><div class="diff-icon">${d.icon}</div><div class="diff-name">${d.name}</div></div>`;});
  document.getElementById('diffGrid').innerHTML=dh;
}
function selectGovt(id){selectedGovt=id;renderSetup();}
function selectCont(id){selectedCont=id;renderSetup();}
function selectDiff(id){selectedDiff=id;renderSetup();}

function generateLeaderName(){
  const f=['Alexander','Maria','Chen','Aisha','Viktor','Elena','Santiago','Fatima','James','Yuki','Omar','Sofia','Raj','Amara','Dmitri'];
  const l=['Petrov','Santos','Chen','Al-Rashid','Mueller','Okafor','Nakamura','Silva','Ivanova','Patel','Kim','Diallo','Andersen'];
  return f[Math.floor(Math.random()*f.length)]+' '+l[Math.floor(Math.random()*l.length)];
}

function startGame(){
  const name=document.getElementById('nationNameInput').value.trim()||'New Republic';
  const flag=document.getElementById('flagInput').value.trim()||'🏴';
  const leader=document.getElementById('leaderInput').value.trim()||generateLeaderName();
  if(!selectedGovt){toast('⚠️','Select a government type','warn');return;}
  if(!selectedCont){toast('⚠️','Select a continent','warn');return;}
  if(!selectedDiff){toast('⚠️','Select difficulty','warn');return;}
  initState(name,flag,selectedGovt,selectedCont,selectedDiff,leader);
  currentNavTab='home';currentTab='economy';
  document.getElementById('setupScreen').classList.add('hidden-left');
  document.getElementById('gameScreen').classList.remove('hidden');
  renderGame();
  toast('🏛️',name+' has been founded! Good luck, '+G.leaderName+'.','success');
}

// ---- NAV ----
const NAV_TABS=[
  {id:'home',icon:'🏠',label:'Home'},{id:'policy',icon:'📋',label:'Policy'},
  {id:'build',icon:'🏗️',label:'Build'},{id:'world',icon:'🌍',label:'World'},
  {id:'tech',icon:'🔬',label:'Tech'},{id:'stats',icon:'📊',label:'Stats'},
];
function renderBottomNav(){
  let h='';
  NAV_TABS.forEach(t=>{
    const showAlert=t.id==='home'&&(G.stability<25||G.happiness<20||G.treasury<-2000||G.pendingEvent);
    h+=`<div class="nav-item ${currentNavTab===t.id?'active':''}" onclick="switchNav('${t.id}')">${showAlert?'<div class="nav-alert"></div>':''}<span class="nav-icon">${t.icon}</span><span class="nav-label">${t.label}</span></div>`;
  });
  document.getElementById('bottomNav').innerHTML=h;
}
function switchNav(tab){currentNavTab=tab;if(tab==='policy')currentTab='economy';if(tab==='world')currentTab='diplo';renderBottomNav();renderGameContent();}

function getNationalMood(){
  if(G.warState) return {emoji:'⚔️',label:'At War',bg:'rgba(239,68,68,0.18)',color:'#f87171'};
  const score=(G.happiness+G.stability+(100-G.corruption))/3;
  if(score>=72) return {emoji:'🌟',label:'Thriving',bg:'rgba(16,185,129,0.13)',color:'#34d399'};
  if(score>=55) return {emoji:'😊',label:'Content',bg:'rgba(16,185,129,0.09)',color:'#6ee7b7'};
  if(score>=40) return {emoji:'😐',label:'Stable',bg:'rgba(240,180,41,0.11)',color:'var(--accent-gold)'};
  if(score>=25) return {emoji:'😟',label:'Uneasy',bg:'rgba(239,68,68,0.1)',color:'#fca5a5'};
  return {emoji:'🔥',label:'Crisis!',bg:'rgba(239,68,68,0.22)',color:'#f87171'};
}
function renderLeaderBar(){
  const trait=LEADER_TRAITS.find(t=>t.id===G.leaderTrait);
  const ac=G.approval>60?'var(--accent-green)':G.approval>35?'var(--accent-gold)':'var(--accent-red)';
  const mood=getNationalMood();
  // Apply war glow to top bar
  const topBar=document.getElementById('gameScreen').querySelector('.top-bar');
  if(topBar){topBar.classList.toggle('at-war',!!G.warState);}
  document.getElementById('leaderBar').innerHTML=`<div class="leader-avatar">${trait?trait.icon:'👤'}</div><div class="leader-info"><div class="leader-name">${G.leaderName}</div><div class="leader-trait">${trait?trait.name+' · '+GOVTS.find(g=>g.id===G.govt).name:''}</div></div><div class="leader-approval" style="color:${ac}">${Math.round(G.approval)}%</div><div class="mood-badge" style="background:${mood.bg};color:${mood.color};border:1px solid ${mood.color}33;">${mood.emoji} ${mood.label}</div>${G.govt==='democracy'&&G.electionYear>G.year?`<div class="election-badge">Elect ${G.electionYear-G.year}yr</div>`:''}`;
}
function renderNewsTicker(){
  const items=G.newsItems.slice(-8);
  const doubled=[...items,...items];
  document.getElementById('newsTickerInner').innerHTML=doubled.map(n=>n+'<span class="ticker-dot"></span>').join('');
}
function renderResourceBar(){
  const net=G.treasuryIncome-G.treasuryExpense;
  const items=[
    {icon:'💵',val:fmtMoneyShort(G.treasury),delta:(net>=0?'+':'')+fmtMoneyShort(net),positive:net>=0,critical:G.treasury<-2000},
    {icon:'👥',val:fmt(G.population),delta:'+'+G.populationGrowth.toFixed(1)+'%',positive:true,critical:false},
    {icon:'📈',val:String(Math.round(G.economy)),positive:G.economy>45,critical:G.economy<20},
    {icon:'😊',val:Math.round(G.happiness)+'%',positive:G.happiness>45,critical:G.happiness<20},
    {icon:'⚔️',val:String(Math.round(G.military)),positive:true,critical:G.military<10},
    {icon:'🔬',val:String(Math.round(G.research)),positive:true,critical:false},
    {icon:'🌍',val:String(Math.round(G.diplomacy)),positive:G.diplomacy>30,critical:G.diplomacy<10},
  ];
  let h='';items.forEach(i=>{h+=`<div class="res-chip ${i.critical?'critical':i.positive?'positive':'negative'}"><span class="res-icon">${i.icon}</span><span class="res-val">${i.val}</span>${i.delta?`<span class="res-delta" style="color:${i.positive?'var(--accent-green)':'#f87171'}">${i.delta}</span>`:''}</div>`;});
  document.getElementById('resourceBar').innerHTML=h;
}
function setPolicyTab(id){currentTab=id;renderGameContent();}
function setWorldTab(id){currentTab=id;renderGameContent();}

function renderGameContent(){
  const el=document.getElementById('gameContent');
  if(!el)return;
  switch(currentNavTab){
    case 'home':el.innerHTML=renderHome();setTimeout(()=>{drawSparkline();drawApprovalSparkline();},50);break;
    case 'policy':el.innerHTML=renderPolicyTab();break;
    case 'build':el.innerHTML=renderBuildTab();break;
    case 'world':el.innerHTML=renderWorldTab();break;
    case 'tech':el.innerHTML=renderTechTab();break;
    case 'stats':el.innerHTML=renderStatsTab();break;
    default:el.innerHTML=renderHome();setTimeout(drawSparkline,50);
  }
}

function renderGame(){
  document.getElementById('gameFlag').textContent=G.flag;
  document.getElementById('gameName').textContent=G.name;
  document.getElementById('gameYear').textContent='Year '+G.year+' · '+getEra();
  G.prestige=calcPrestige();
  document.getElementById('prestigeDisplay').textContent=fmt(G.prestige);
  renderLeaderBar();renderNewsTicker();renderResourceBar();renderBottomNav();renderGameContent();
  const btn=document.getElementById('nextTurnBtn');
  if(G.pendingEvent){btn.textContent='⚠️ Resolve Event First';btn.classList.add('has-event');}
  else{btn.textContent='⚡ Advance Year';btn.classList.remove('has-event');}
  document.getElementById('logBadge').style.display=G.newNotifications?'flex':'none';
}

// ---- HOME ----
function renderHome(){
  const ac=G.approval>70?'var(--accent-green)':G.approval>40?'var(--accent-gold)':'var(--accent-red)';
  const factors=[];
  if(G.happiness>60)factors.push({label:'😊 Happy Citizens',color:'rgba(16,185,129,0.12)',border:'rgba(16,185,129,0.25)',text:'#34d399'});
  if(G.happiness<40)factors.push({label:'😞 Unhappy Citizens',color:'rgba(239,68,68,0.12)',border:'rgba(239,68,68,0.25)',text:'#f87171'});
  if(G.economy>60)factors.push({label:'📈 Strong Economy',color:'rgba(16,185,129,0.12)',border:'rgba(16,185,129,0.25)',text:'#34d399'});
  if(G.economy<30)factors.push({label:'📉 Weak Economy',color:'rgba(239,68,68,0.12)',border:'rgba(239,68,68,0.25)',text:'#f87171'});
  if(G.corruption>50)factors.push({label:'🏴‍☠️ High Corruption',color:'rgba(239,68,68,0.12)',border:'rgba(239,68,68,0.25)',text:'#f87171'});
  if(G.stability<40)factors.push({label:'🔥 Instability',color:'rgba(239,68,68,0.12)',border:'rgba(239,68,68,0.25)',text:'#f87171'});
  if(G.health>60)factors.push({label:'💊 Good Healthcare',color:'rgba(16,185,129,0.12)',border:'rgba(16,185,129,0.25)',text:'#34d399'});
  if(G.education>60)factors.push({label:'📚 Well Educated',color:'rgba(59,130,246,0.12)',border:'rgba(59,130,246,0.25)',text:'#60a5fa'});
  if(G.researchedTechs.length>3)factors.push({label:'🔬 Tech Leader',color:'rgba(139,92,246,0.12)',border:'rgba(139,92,246,0.25)',text:'#a78bfa'});
  let warnings='';
  if(G.treasury<0)warnings+=`<div class="warning-banner">⚠️ National deficit — ${fmtMoneyShort(Math.abs(G.treasuryIncome-G.treasuryExpense))}/yr in the red</div>`;
  if(G.stability<25)warnings+=`<div class="warning-banner">🚨 Critical instability — civil unrest risk</div>`;
  if(G.happiness<20)warnings+=`<div class="warning-banner">😡 Citizens furious — revolution risk high</div>`;
  if(G.corruption>75)warnings+=`<div class="warning-banner">🏴‍☠️ Rampant corruption strangling the nation</div>`;
  const factorHtml=factors.map(f=>`<span class="factor-tag" style="background:${f.color};color:${f.text};border-color:${f.border}">${f.label}</span>`).join('');
  let pendingEventHtml='';
  if(G.pendingEvent){
    const e=G.pendingEvent;
    const choicesHtml=e.choices.map((c,i)=>`<div class="event-choice" onclick="resolveEvent(${i})">${c.text}${c.cost?`<span class="choice-cost">${c.cost}</span>`:''}${c.tags?`<div class="choice-effects">${c.tags.map(t=>`<span class="choice-tag ${t.p?'pos':'neg'}">${t.t}</span>`).join('')}</div>`:''}</div>`).join('');
    pendingEventHtml=`<div class="event-card ${e.type} fade-up"><div class="event-type">${e.type.toUpperCase()}</div><div class="event-title">${e.title}</div><div class="event-desc">${e.desc}</div><div class="event-choices">${choicesHtml}</div></div>`;
  }
  const net=G.treasuryIncome-G.treasuryExpense;
  const netColor=net>=0?'var(--accent-green)':'var(--accent-red)';
  const gdpTotal=getGdpTotal();
  // Active research widget
  let techWidgetHtml='';
  if(G.activeTech){
    const t=TECHNOLOGIES.find(x=>x.id===G.activeTech.id);
    if(t){const total=t.turns,done=total-G.activeTech.turnsLeft,pct=Math.round((done/Math.max(1,total))*100);
      techWidgetHtml=`<div class="research-widget fade-up"><div class="rw-icon">${t.icon}</div><div class="rw-info"><div class="rw-name">🔬 Researching: ${t.name}</div><div class="rw-bar-track"><div class="rw-bar-fill" style="width:${pct}%"></div></div><div class="rw-meta">${G.activeTech.turnsLeft} yr remaining · ${t.desc}</div></div><div class="rw-pct">${pct}%</div></div>`;}
  }
  // War strength bar
  let warHtml='';
  if(G.warState){
    const enemy=G.aiNations[G.warState.enemy];
    if(enemy){
      const myPow=Math.min(99,Math.round(G.military*1.2+(G.hasNukes?20:0)+G.espionage*0.3));
      const enPow=Math.min(99,Math.round(enemy.strength*1.2));
      const total=myPow+enPow||1;const myPct=Math.round((myPow/total)*100);const enPct=100-myPct;
      warHtml=`<div class="event-card disaster fade-up" style="margin-bottom:10px;"><div class="event-type">⚔️ ACTIVE WAR · YEAR ${G.warState.turns}</div><div class="event-title">War with ${enemy.flag} ${enemy.name}</div><div class="event-desc">The conflict continues — resolve quickly to minimize economic damage.</div><div class="battle-strength-bar"><div class="bsb-labels"><span style="color:#60a5fa">🛡️ ${G.name} (${myPow})</span><span style="color:#f87171">${enemy.name} ${enemy.flag} (${enPow})</span></div><div class="bsb-track"><div class="bsb-player" style="width:${myPct}%"></div><div class="bsb-enemy" style="width:${enPct}%"></div></div></div><div style="font-size:10px;color:var(--text-muted);margin-top:6px;">⚠️ War costs ${fmtMoneyShort(500)}/yr · Economy -2 · Happiness -3 per turn</div></div>`;
    }
  }
  return `${warnings}${techWidgetHtml}${warHtml}
  <div class="prestige-panel fade-up">
    <div class="prestige-title">⭐ National Prestige</div>
    <div class="prestige-score">${fmt(G.prestige)}</div>

function _drawLineChart(canvasId,data,lineColor,fillColor1,fillColor2){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const rect=canvas.parentElement.getBoundingClientRect();canvas.width=rect.width;canvas.height=canvas.parentElement.offsetHeight||40;
  const ctx=canvas.getContext('2d');if(data.length<2)return;
  const min=Math.min(...data)*0.92,max=Math.max(...data)*1.05;
  const W=canvas.width,H=canvas.height,pad={t:4,r:4,b:4,l:4};
  const pts=data.map((v,i)=>[pad.l+(i/(data.length-1))*(W-pad.l-pad.r),H-pad.b-((v-min)/(max-min||1))*(H-pad.t-pad.b)]);
  const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,fillColor1);grad.addColorStop(1,fillColor2);
  ctx.beginPath();ctx.moveTo(pts[0][0],H-pad.b);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(pts[pts.length-1][0],H-pad.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));ctx.strokeStyle=lineColor;ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  const last=pts[pts.length-1];ctx.beginPath();ctx.arc(last[0],last[1],3.5,0,Math.PI*2);ctx.fillStyle=lineColor;ctx.fill();
}

function renderProgressBar(label,key,color,inverted=false){
  const val=Math.round(G[key]);const dc=inverted?(val>50?'var(--accent-red)':'var(--accent-green)'):(val<25?'var(--accent-red)':val<45?'var(--accent-gold)':color);
  let deltaHtml='';
  if(G.prevStats&&G.prevStats[key]!==undefined){
    const d=Math.round(G[key]-G.prevStats[key]);
    if(d>0) deltaHtml=`<span class="pl-delta ${inverted?'down':'up'}">${inverted?'▼':'▲'}${Math.abs(d)}</span>`;
    else if(d<0) deltaHtml=`<span class="pl-delta ${inverted?'up':'down'}">${inverted?'▲':'▼'}${Math.abs(d)}</span>`;
  }
  return `<div class="progress-row"><div class="progress-label"><span class="pl-name">${label}${deltaHtml}</span><span class="pl-val" style="color:${dc}">${val}/100</span></div><div class="progress-track"><div class="progress-fill" style="width:${val}%;background:${dc}"></div></div></div>`;
}

function enactPolicy(id){
  const p=findPolicy(id);if(!p)return;
  if(G.activePolicies.includes(id)){toast('ℹ️','Already active');return;}
  if(G.treasury<p.cost){toast('❌','Need '+fmtMoneyShort(p.cost)+' — only '+fmtMoneyShort(G.treasury)+' available','error');return;}
  G.treasury-=p.cost;G.activePolicies.push(id);G.policiesEnacted++;
  applyEffects(p.effects,true);addLog('📜','Enacted: '+p.name,G.year);
  if(p.id==='nukes'){G.hasNukes=true;addNews('☢️ '+G.name+' has successfully tested a nuclear device!');}
  if(p.id==='space'){G.hasSpace=true;addNews('🚀 '+G.name+' Space Agency established!');}
  toast('✅',p.name+' enacted!','success');checkAchievements();renderGame();
}
function removePolicy(id){
  const p=findPolicy(id);if(!p)return;
  if(!p.annualCost||p.oneTime){toast('ℹ️','This policy cannot be repealed');return;}
  G.activePolicies=G.activePolicies.filter(x=>x!==id);
  addLog('❌','Repealed: '+p.name,G.year);toast('❌',p.name+' repealed','warn');renderGame();
}
function applyEffects(effects,instant=false){
  Object.entries(effects).forEach(([k,v])=>{
    if(k==='treasury')G.treasury+=v*(instant?5:10);
    else if(k==='population')G.population=Math.floor(G.population*(1+v/100));
    else if(['trade','production','energy','tourism','espionage','education','health','environment','equality','corruption','research','happiness','stability','military','diplomacy','economy'].includes(k))G[k]=clamp((G[k]||0)+v);
    else if(G[k]!==undefined)G[k]+=v;
  });
}

  ];

function runSpyMission(id){
  const m=SPY_MISSIONS.find(x=>x.id===id);if(!m||G.treasury<m.cost)return;
  G.treasury-=m.cost;
  const sc=Math.min(0.95,m.success+(G.espionage-30)*0.002);
  const ok=Math.random()<sc;
  if(ok){applyEffects(m.effects,true);G.spySuccesses++;addLog('🕵️','Mission "'+m.name+'" succeeded!',G.year);toast('🕵️','Mission success!','success');}
  else{applyEffects(m.failEffects,true);addLog('⚠️','Mission "'+m.name+'" failed — agent burned!',G.year);toast('💥','Mission failed! Consequences.','error');}
  checkAchievements();renderGame();
}

function renderTechTab(){
  let activeTechInfo='';
  if(G.activeTech){
    const t=TECHNOLOGIES.find(x=>x.id===G.activeTech.id);
    if(t){
      const progress=Math.round(((t.turns-G.activeTech.turnsLeft)/t.turns)*100);
      activeTechInfo=`<div style="padding:12px;background:linear-gradient(145deg,rgba(139,92,246,0.1),transparent);border:1px solid rgba(139,92,246,0.25);border-radius:var(--radius-xs);margin-bottom:14px;">

        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;font-weight:700;">${t.icon} ${t.name}</span>
          <span style="font-size:11px;font-family:'Space Mono',monospace;color:var(--accent-gold);">${G.activeTech.turnsLeft} yr left</span>
        </div>
        <div class="tech-progress" style="margin-top:8px;"><div class="tech-progress-fill" style="width:${progress}%"></div></div>
      </div>`;
    }
  }
  let h=activeTechInfo+`<div style="padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xs);margin-bottom:14px;font-size:11px;color:var(--text-muted);">🔬 Researched: <strong style="color:var(--text-primary)">${G.researchedTechs.length}/${TECHNOLOGIES.length}</strong> &nbsp;·&nbsp; Research: <strong style="color:var(--accent-purple)">${Math.round(G.research)}/100</strong></div>`;
  [1,2,3].forEach(tier=>{
    const tierTechs=TECHNOLOGIES.filter(t=>t.tier===tier);
    const tierName=['','Tier 1 — Foundations','Tier 2 — Advanced','Tier 3 — Future'][tier];
    h+=`<div class="section-divider">${tierName}</div>`;
    tierTechs.forEach(t=>{
      const isResearched=G.researchedTechs.includes(t.id);
      const isActive=G.activeTech&&G.activeTech.id===t.id;
      const prereqsMet=t.requires.every(r=>G.researchedTechs.includes(r));
      const canAfford=G.treasury>=t.cost;
      const isLocked=!prereqsMet||isResearched||(G.activeTech&&!isActive);
      let statusBadge='';
      if(isResearched)statusBadge=`<span class="tech-badge done">✅ Done</span>`;
      else if(isActive)statusBadge=`<span class="tech-badge active">⏳ ${G.activeTech.turnsLeft}yr</span>`;
      else if(prereqsMet&&canAfford)statusBadge=`<span class="tech-badge avail">Available</span>`;
      else if(!prereqsMet)statusBadge=`<span style="font-size:9px;color:var(--text-muted)">🔒 Req: ${t.requires.join(', ')}</span>`;
      else statusBadge=`<span style="font-size:9px;color:#f87171">Need ${fmtMoneyShort(t.cost)}</span>`;
      const efh=Object.entries(t.effects).map(([k,v])=>`<span class="policy-effect ${v>0?'positive':'negative'}">${k}: ${v>0?'+':''}${v}</span>`).join('');
      const clickable=!isResearched&&!isActive&&prereqsMet&&canAfford&&!G.activeTech;
      h+=`<div class="tech-card ${isResearched?'researched':isActive?'researching':!prereqsMet?'locked':''}" ${clickable?`onclick="startResearch('${t.id}')"`:''}style="${(!prereqsMet||(!canAfford&&!isResearched&&!isActive))?'cursor:not-allowed':''}">
        <div class="tech-icon">${t.icon}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;"><span class="tech-name">${t.name}</span>${statusBadge}</div>
          <div class="tech-desc">${t.desc}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;">${efh}</div>
          ${!isResearched&&!isActive?`<div style="font-size:9px;color:var(--text-muted);margin-top:4px;">⏱ ${t.turns} year${t.turns>1?'s':''} · 💵 ${fmtMoneyShort(t.cost)}</div>`:''}
          ${isActive?`<div class="tech-progress" style="margin-top:6px;"><div class="tech-progress-fill" style="width:${Math.round(((TECHNOLOGIES.find(x=>x.id===G.activeTech.id).turns-G.activeTech.turnsLeft)/TECHNOLOGIES.find(x=>x.id===G.activeTech.id).turns)*100)}%"></div></div>`:''}
        </div>
      </div>`;
    });
  });
  return h+'<div style="height:80px;"></div>';
}
function startResearch(id){
  const t=TECHNOLOGIES.find(x=>x.id===id);if(!t)return;
  if(G.researchedTechs.includes(id)){toast('ℹ️','Already researched');return;}
  if(G.activeTech){toast('⚠️','Research already in progress','warn');return;}
  if(!t.requires.every(r=>G.researchedTechs.includes(r))){toast('❌','Prerequisites not met','error');return;}
  if(G.treasury<t.cost){toast('❌','Need '+fmtMoneyShort(t.cost),'error');return;}
  G.treasury-=t.cost;G.activeTech={id,turnsLeft:t.turns};
  addLog('🔬','Research started: '+t.name,G.year);toast('🔬','Researching: '+t.name+' ('+t.turns+' years)','success');renderGame();
}

  const relLabel=n.atWar?'⚔️ AT WAR':n.alliance?'🤝 Allied':n.relation>60?'Friendly':n.relation>35?'Neutral':'Hostile';
  let actions='';
  if(!n.atWar){
    if(!n.tradeAgreement&&n.relation>30)actions+=`<div class="event-choice" onclick="diploAction(${idx},'trade')">📦 Propose Trade Agreement <span class="choice-cost">${fmtMoneyShort(500)}</span></div>`;
    if(!n.alliance&&n.relation>60)actions+=`<div class="event-choice" onclick="diploAction(${idx},'ally')">🤝 Form Military Alliance <span class="choice-cost">${fmtMoneyShort(1000)}</span></div>`;
    if(n.relation<70)actions+=`<div class="event-choice" onclick="diploAction(${idx},'gift')">🎁 Foreign Aid Grant (+15 relations) <span class="choice-cost">${fmtMoneyShort(800)}</span></div>`;
    if(n.relation<50)actions+=`<div class="event-choice" onclick="diploAction(${idx},'sanction')">🚫 Impose Economic Sanctions</div>`;
    // FIX: check if already at war before allowing war declaration
    if(!G.warState&&n.relation<60)actions+=`<div class="event-choice" onclick="diploAction(${idx},'war')" style="border-color:rgba(239,68,68,0.3);color:#f87171;">⚔️ Declare War</div>`;
  } else {
    actions+=`<div class="event-choice" onclick="diploAction(${idx},'peace')">🕊️ Negotiate Peace Treaty <span class="choice-cost">${fmtMoneyShort(2000)}</span></div>`;
    actions+=`<div class="event-choice" onclick="diploAction(${idx},'push')">💣 Push War Effort (-${fmtMoneyShort(500)})</div>`;
  }
  document.getElementById('modalContent').innerHTML=`
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:60px;line-height:1;margin-bottom:10px;">${n.flag}</div>
      <div class="modal-title">${n.name}</div>
      <div class="diplo-relation ${relClass}" style="display:inline-block;margin-top:6px;font-size:12px;padding:4px 12px;">${relLabel} · ${Math.round(n.relation)}/100</div>
    </div>
    <div class="sector-content" style="margin-bottom:16px;"><div class="sector-body">
      <div class="info-row"><span class="info-label">Strategy</span><span class="info-val" style="text-transform:capitalize">${n.personality}</span></div>
      <div class="info-row"><span class="info-label">Military Strength</span><span class="info-val">${Math.round(n.strength)}/100</span></div>
      <div class="info-row"><span class="info-label">Trade Agreement</span><span class="info-val" style="color:${n.tradeAgreement?'#34d399':'#f87171'}">${n.tradeAgreement?'✅ Active':'❌ None'}</span></div>
      <div class="info-row"><span class="info-label">Alliance Status</span><span class="info-val" style="color:${n.alliance?'#34d399':'#f87171'}">${n.alliance?'✅ Allied':'❌ None'}</span></div>
    </div></div>
    <div style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;">Diplomatic Options</div>
    ${actions||'<div class="empty-state" style="padding:12px 0"><div style="font-size:11px;">No actions available.</div></div>'}
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function diploAction(idx,action){
  const n=G.aiNations[idx];
  switch(action){
    case 'trade': if(G.treasury<500){toast('❌','Need '+fmtMoneyShort(500),'error');return;} G.treasury-=500;n.tradeAgreement=true;n.relation=Math.min(100,n.relation+10);G.trade=clamp(G.trade+5);addLog('📦','Trade agreement: '+n.name,G.year);addNews('📦 '+G.name+' signs trade agreement with '+n.name);toast('📦','Trade with '+n.name+'!','success');break;
    case 'ally': if(G.treasury<1000){toast('❌','Need '+fmtMoneyShort(1000),'error');return;} G.treasury-=1000;n.alliance=true;n.relation=Math.min(100,n.relation+20);G.allies++;addLog('🤝','Alliance: '+n.name,G.year);addNews('🤝 '+G.name+' and '+n.name+' sign mutual defense pact');toast('🤝','Alliance with '+n.name+'!','success');break;
    case 'gift': if(G.treasury<800){toast('❌','Need '+fmtMoneyShort(800),'error');return;} G.treasury-=800;n.relation=Math.min(100,n.relation+15);addLog('🎁','Aid to '+n.name,G.year);toast('🎁','Relations improved!','success');break;
    case 'sanction': n.relation=Math.max(0,n.relation-12);G.diplomacy=clamp(G.diplomacy-3);addLog('🚫','Sanctions: '+n.name,G.year);toast('🚫','Sanctions imposed','warn');break;
    case 'war':
      if(G.warState){toast('⚠️','Already at war!','warn');return;}
      n.atWar=true;n.alliance=false;n.tradeAgreement=false;n.relation=0;
      G.warState={enemy:idx,turns:0};G.diplomacy=clamp(G.diplomacy-10);
      addLog('⚔️','War declared on '+n.name,G.year);addNews('⚔️ BREAKING: '+G.name+' declares war on '+n.name+'!');
      toast('⚔️','War declared!','error');break;
    case 'peace': if(G.treasury<2000){toast('❌','Need '+fmtMoneyShort(2000),'error');return;} G.treasury-=2000;n.atWar=false;n.relation=20;G.warState=null;addLog('🕊️','Peace with '+n.name,G.year);addNews('🕊️ '+G.name+' and '+n.name+' sign ceasefire');toast('🕊️','Peace achieved!','success');break;
    case 'push': if(G.treasury<500){toast('❌','Need '+fmtMoneyShort(500),'error');return;} G.treasury-=500;G.military=clamp(G.military+3);toast('⚔️','War effort intensified!','warn');break;
  }
  updateRelationLabels();closeModal();checkAchievements();renderGame();
}
function updateRelationLabels(){
  G.aiNations.forEach(n=>{n.relationLabel=n.atWar?'hostile':n.alliance?'allied':n.relation>60?'friendly':n.relation>35?'neutral':'hostile';});
  G.allies=G.aiNations.filter(n=>n.alliance).length;
}

// ---- EVENTS ----
function resolveEvent(choiceIdx){
  if(!G.pendingEvent)return;
  const choice=G.pendingEvent.choices[choiceIdx];
  const hasCostString=!!choice.cost;
  if(hasCostString){
    // Parse the labeled cost string and charge treasury once
    const match=choice.cost.match(/\$([\d,]+)([BMK]?)/);
    if(match){
      let amt=parseFloat(match[1].replace(/,/g,''));
      if(match[2]==='B')amt*=1000;else if(match[2]==='M')amt*=1;else if(match[2]==='K')amt/=1000;
      G.treasury-=amt;
    }
  }
  if(G.pendingEvent.type==='disaster')G.disastersSurvived++;
  // When a cost string already charged treasury, skip treasury in effects to avoid double-charging.
  // Event data has both cost:'$Xm' display labels AND effects.treasury for the same expense.
  const effectsToApply=hasCostString
    ? Object.fromEntries(Object.entries(choice.effects).filter(([k])=>k!=='treasury'))
    : choice.effects;
  applyEffects(effectsToApply,true);
  addLog('📢',G.pendingEvent.title+': '+choice.text.substring(0,40)+'...',G.year);
  toast('📢','Decision made: '+G.pendingEvent.title.substring(0,30)+'...','success');
  G.lastEventId=G.pendingEvent.id;G.pendingEvent=null;
  checkAchievements();renderGame();
}
function triggerRandomEvent(){
  if(G.pendingEvent)return;
  const chance=G.difficulty==='hard'?0.70:G.difficulty==='normal'?0.55:0.40;
  if(Math.random()<chance){
    let pool=[...EVENTS];
    if(G.environment<30){const d=EVENTS.filter(e=>e.type==='disaster');pool=[...pool,...d,...d];}
    if(G.difficulty==='hard')pool=[...pool,...EVENTS.filter(e=>e.type==='crisis')];
    // FIX: filter out last event to prevent repeats
    const filtered=pool.filter(e=>e.id!==G.lastEventId);
    const eligible=filtered.length>0?filtered:pool;
    const evt=eligible[Math.floor(Math.random()*eligible.length)];
    G.pendingEvent=JSON.parse(JSON.stringify(evt));
    G.newNotifications=true;
  }
  if(G.govt==='democracy'&&G.year>=G.electionYear)triggerElection();
}
function triggerElection(){
  if(G.pendingEvent)return;
  G.pendingEvent={id:'election',type:'election',title:'⚡ Election Season — Year '+G.year,desc:'With '+Math.round(G.approval)+'% approval, '+G.leaderName+' faces the voters.',choices:[
    {text:'🗳️ Bold Campaign — Big promises',effects:{happiness:10,treasury:-15,stability:5},cost:'$150M',tags:[{t:'Approval +10',p:true}]},
    {text:'⚖️ Conservative Campaign',effects:{stability:8,happiness:3},tags:[{t:'Stability +8',p:true}]},
    {text:'💰 Populist Giveaways',effects:{happiness:15,treasury:-25,corruption:5},cost:'$250M',tags:[{t:'Votes secured',p:true}]},
  ]};
  G.electionYear=G.year+4;G.newNotifications=true;
}

// ---- NEXT TURN ----
function nextTurn(){
  if(_processingTurn)return;
  if(G.pendingEvent){toast('⚠️','Resolve the current event first!','warn');currentNavTab='home';renderBottomNav();renderGameContent();return;}
  _processingTurn=true;
  G.year++;
  const prevGdp=G.gdpPerCapita;
  const overlay=document.getElementById('turnOverlay');
  document.getElementById('turnYear').textContent='Year '+G.year;
  overlay.classList.remove('hidden');
  // Process after brief visual delay
  setTimeout(()=>{
    processTurn();
    autoSave();
    const net=G.treasuryIncome-G.treasuryExpense;
    const gdpChange=G.gdpPerCapita-prevGdp;
    document.getElementById('turnSummary').innerHTML=`
      <div class="turn-item" style="color:${net>=0?'#34d399':'#f87171'}">${net>=0?'▲':'▼'} Budget: ${fmtMoneyShort(Math.abs(net))}/yr</div>
      <div class="turn-item" style="color:${gdpChange>=0?'#34d399':'#f87171'}">${gdpChange>=0?'▲':'▼'} GDP: $${Math.abs(Math.round(gdpChange))}/capita</div>
      <div class="turn-item" style="color:var(--text-muted)">👥 ${fmt(G.population)} · ⭐ ${fmt(G.prestige)} prestige</div>
      ${G.activeTech?`<div class="turn-item" style="color:var(--accent-purple)">🔬 ${(TECHNOLOGIES.find(t=>t.id===G.activeTech.id)||{name:''}).name}: ${G.activeTech.turnsLeft} yr left</div>`:''}
    `;
    if(!G.gameOver){
      setTimeout(()=>{overlay.classList.add('hidden');_processingTurn=false;renderGame();},1200);
    } else {
      setTimeout(()=>{overlay.classList.add('hidden');_processingTurn=false;},600);
    }
  },100);
}

function processTurn(){
  // Snapshot stats for delta display (before any modifications)
  const _STAT_KEYS=['happiness','economy','stability','health','education','environment','equality','corruption','research','military','diplomacy'];
  G.prevStats={};_STAT_KEYS.forEach(k=>G.prevStats[k]=G[k]);
  const _prevEra=G.currentEra||getEra();
  // Population growth
  const growthFactor=1+(G.populationGrowth/100)*(G.health/80)*(G.happiness/60);
  G.population=Math.floor(G.population*growthFactor);
  G.populationGrowth=clamp(G.populationGrowth+(Math.random()-0.45)*0.1,0.5,3.5);
  // GDP growth
  const gdpGrowth=((G.economy-45)/500)+(G.research/2000)+(G.trade/2000);
  G.gdpPerCapita=Math.max(500,Math.floor(G.gdpPerCapita*(1+gdpGrowth)));
  G.gdpHistory.push(G.gdpPerCapita);if(G.gdpHistory.length>40)G.gdpHistory.shift();
  // Budget bonuses
  const milBonus=(G.budgetMilitary-20)*0.1;const healthBonus=(G.budgetHealth-20)*0.1;
  const eduBonus=(G.budgetEducation-15)*0.1;const researchBonus=(G.budgetResearch-10)*0.15;
  // Treasury
  const popM=G.population/1000000;
  const diffMult=G.difficulty==='easy'?1.2:G.difficulty==='hard'?0.75:1;
  G.treasuryIncome=Math.floor((G.economy*15+G.trade*10+G.production*6+G.tourism*4)*popM*diffMult);
  let policyExpenses=G.activePolicies.reduce((s,id)=>{const p=findPolicy(id);return s+(p?(p.annualCost||0):0);},0);
  G.treasuryExpense=Math.floor(G.military*15*popM*0.3+policyExpenses+popM*20+100+(G.activeTech?200:0));
  G.treasury+=G.treasuryIncome-G.treasuryExpense;
  G.treasuryHistory.push(G.treasury);if(G.treasuryHistory.length>40)G.treasuryHistory.shift();
  // Debt tracking
  const deficit=G.treasuryIncome-G.treasuryExpense;
  if(deficit<0)G.totalDebt-=deficit;else G.totalDebt=Math.max(0,G.totalDebt-deficit*0.3);
  G.debtGdpRatio=Math.min(999,(G.totalDebt/Math.max(1,getGdpTotal()))*100);
  // Stat drifts
  const d=G.difficulty==='hard'?1.5:1;
  G.happiness=clamp(G.happiness+(Math.random()-0.5)*4*d+(G.economy>50?1:-1)+(G.corruption>40?-2:0)+(G.health>50?0.5:0)+healthBonus*0.3);
  G.stability=clamp(G.stability+(Math.random()-0.5)*3*d+(G.happiness>50?0.5:-1)+(G.corruption>50?-1:0)+milBonus*0.2);
  G.corruption=clamp(G.corruption+(Math.random()-0.42)*2+(G.activePolicies.includes('censorship')?0.5:0));
  G.environment=clamp(G.environment+(Math.random()-0.55)*2+(G.production>60?-1:0)+(G.activePolicies.includes('green')?0.5:0));
  G.economy=clamp(G.economy+(Math.random()-0.5)*3+(G.education>50?0.5:0)+(G.trade>50?0.5:0));
  G.research=clamp(G.research+(Math.random()-0.4)*2+(G.education>50?0.5:0)+researchBonus*0.4+(G.activeTech?0.5:0));
  G.health=clamp(G.health+(Math.random()-0.5)*2+(G.activePolicies.includes('healthcare')?0.5:0)+healthBonus*0.3);
  G.education=clamp(G.education+(Math.random()-0.4)*1.5+(G.activePolicies.includes('education')?0.5:0)+eduBonus*0.3);
  G.diplomacy=clamp(G.diplomacy+(Math.random()-0.5)*2+(G.allies>0?0.3:0));
  G.trade=clamp(G.trade+(Math.random()-0.45)*1.5+G.aiNations.filter(n=>n.tradeAgreement).length*0.2);
  G.military=clamp(G.military+milBonus*0.2);
  // Approval
  G.approval=clamp(G.happiness*0.32+G.economy*0.22+G.stability*0.15+G.health*0.10+G.education*0.10+(100-G.corruption)*0.11);
  G.approvalHistory.push(G.approval);
  // Tech progress
  if(G.activeTech){
    G.activeTech.turnsLeft=Math.max(0,G.activeTech.turnsLeft-1);
    if(G.activeTech.turnsLeft<=0){
      const t=TECHNOLOGIES.find(x=>x.id===G.activeTech.id);
      if(t){
        G.researchedTechs.push(t.id);applyEffects(t.effects,true);
        addLog('🔬','Technology complete: '+t.name,G.year);addNews('🔬 '+G.name+' completes research on '+t.name+'!');
        toast('🔬','Technology unlocked: '+t.name+'!','success');G.activeTech=null;
      }
    }
  }
  // AI Nations
  G.aiNations.forEach((n,idx)=>{
    if(!n.atWar){
      n.relation=clamp(n.relation+(Math.random()-0.5)*5+(n.personality==='diplomatic'?1:n.personality==='peaceful'?0.5:0));
      // AI declares war
      if(n.personality==='aggressive'&&Math.random()<0.04&&n.relation<20&&!G.warState){
        n.atWar=true;n.alliance=false;n.tradeAgreement=false;G.warState={enemy:idx,turns:0};
        toast('⚔️',n.name+' declared war!','error');addLog('⚔️',n.name+' declares war!',G.year);
        addNews('⚔️ BREAKING: '+n.name+' launches attack on '+G.name+'!');
      }
    }
    n.strength=clamp(n.strength+(Math.random()-0.4)*3,15,98);
  });
  updateRelationLabels();
  // War resolution
  if(G.warState){
    G.warState.turns++;
    const enemy=G.aiNations[G.warState.enemy];
    if(enemy&&G.warState.turns>=3){
      const myPow=G.military*1.2+(G.hasNukes?25:0)+G.espionage*0.3+Math.random()*15;
      const enPow=enemy.strength*1.2+Math.random()*20;
      if(myPow>enPow||G.warState.turns>=7){
        const win=myPow>enPow;
        enemy.atWar=false;enemy.relation=win?15:10;
        if(win){const spoils=2000+Math.floor(Math.random()*2000);G.treasury+=spoils;G.warsWon++;G.warState=null;toast('🏆','Victory! Spoils: '+fmtMoneyShort(spoils),'success');addLog('🏆','Victory over '+enemy.name+'!',G.year);addNews('🏆 '+G.name+' wins decisive victory over '+enemy.name);}
        else{const losses=1500+Math.floor(Math.random()*1500);G.treasury-=losses;G.warsLost++;G.military=clamp(G.military-12);G.happiness=clamp(G.happiness-10);G.warState=null;toast('💀','Defeated! Losses: '+fmtMoneyShort(losses),'error');addLog('💀','Defeat against '+enemy.name,G.year);}
      }
    }
    if(G.warState){G.treasury-=500;G.happiness=clamp(G.happiness-3);G.economy=clamp(G.economy-2);}
  }
  triggerRandomEvent();
  if(G.activePolicies.includes('nukes'))G.hasNukes=true;
  if(G.activePolicies.includes('space'))G.hasSpace=true;
  if(G.year%5===0)addNews('📊 Year '+G.year+': GDP $'+fmt(G.gdpPerCapita)+'/capita · Treasury '+fmtMoneyShort(G.treasury)+' · Prestige '+fmt(calcPrestige()));
  // Era change detection
  const _newEra=getEra();
  if(_newEra!==_prevEra){
    G.currentEra=_newEra;
    addLog('🌅','New Era: '+_newEra,G.year);
    addNews('🌅 '+G.name+' enters the '+_newEra+'!');
    setTimeout(()=>toast('🌅','New Era: '+_newEra,'success'),200);
  }
  // Game over checks
  G.prestige=calcPrestige();
  checkAchievements();
  if(G.treasury<-15000){gameOver(G.name+' declared national bankruptcy. Debt reached '+fmtMoneyShort(Math.abs(G.treasury))+'.',false);return;}
  if(G.stability<4){gameOver('Civil war erupts! Your government collapses under extreme instability.',false);return;}
  if(G.happiness<4){gameOver('Revolution! The people rise up — your government is overthrown.',false);return;}
  if(G.approval<4){gameOver('With '+Math.round(G.approval)+'% approval, '+G.leaderName+' is removed in a constitutional crisis.',false);return;}
  if(G.year>=200){gameOver('After '+G.year+' years, '+G.name+' stands as a timeless civilization.',true);return;}
}

function gameOver(reason,isWin){
  G.gameOver=true;
  const gs=document.getElementById('gameScreen');const go=document.getElementById('gameOverScreen');
  gs.classList.add('hidden-left');go.classList.remove('hidden');
  document.getElementById('goIcon').textContent=isWin?'🎉':'💀';
  document.getElementById('goTitle').textContent=isWin?'Legendary Civilization!':'Nation Collapsed';
  document.getElementById('goReason').textContent=reason;
  document.getElementById('goStats').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin-top:16px;">
    <div class="stat-card gold"><div class="stat-label">Years Survived</div><div class="stat-value">${G.year}</div></div>
    <div class="stat-card blue"><div class="stat-label">Final Population</div><div class="stat-value">${fmt(G.population)}</div></div>
    <div class="stat-card green"><div class="stat-label">Peak GDP/Capita</div><div class="stat-value">$${fmt(Math.max(...G.gdpHistory))}</div></div>
    <div class="stat-card purple"><div class="stat-label">Prestige Score</div><div class="stat-value">${fmt(G.prestige)}</div></div>
    <div class="stat-card red"><div class="stat-label">Wars Won</div><div class="stat-value">${G.warsWon}</div></div>
    <div class="stat-card cyan"><div class="stat-label">Achievements</div><div class="stat-value">${G.unlockedAchievements.length}/${ACHIEVEMENTS.length}</div></div>
  </div>`;
}

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!G.unlockedAchievements.includes(a.id)&&a.check(G)){
      G.unlockedAchievements.push(a.id);
      toast(a.icon,'Achievement: '+a.name+'!','success');
      addLog(a.icon,'Achievement: '+a.name,G.year);
    }
  });
}
