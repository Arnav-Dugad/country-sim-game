      if(el)el.oninput=function(){
        G[k]=parseInt(this.value);
        const lbl=document.getElementById('bsv_'+k);if(lbl)lbl.textContent=this.value+'%';
        updateSliderStyle(this,k);
      };
    });
  },50);
}

// FIX: Use id-based event handlers for sliders (no inline oninput with complex styles)
const SLIDER_COLORS={'budgetMilitary':'var(--accent-red)','budgetHealth':'#f472b6','budgetEducation':'var(--accent-purple)','budgetInfra':'var(--accent-blue)','budgetWelfare':'var(--accent-green)','budgetResearch':'var(--accent-cyan)'};
function mkSlider(label,key,min,max,color){
  const pct=((G[key]-min)/(max-min))*100;
  return `<div class="budget-slider-row">
    <div class="budget-slider-label">
      <span class="bsl-name">${label}</span><span class="bsl-val" id="bsv_${key}">${G[key]}%</span>
    </div>
    <input id="slider_${key}" type="range" class="budget-slider" min="${min}" max="${max}" value="${G[key]}">
  </div>`;
}
function updateSliderStyle(input,key){}

function emergencyLoan(){G.treasury+=5000;G.totalDebt+=6000;G.debtGdpRatio+=10;closeModal();toast('🏦','IMF loan of '+fmtMoneyShort(5000)+' received.','warn');renderGame();}

function addLog(icon,text,year){G.eventLog.unshift({icon,text,year});if(G.eventLog.length>60)G.eventLog.pop();G.newNotifications=true;}
function addNews(text){G.newsItems.push(text);if(G.newsItems.length>25)G.newsItems.shift();}

function showLog(){
  G.newNotifications=false;document.getElementById('logBadge').style.display='none';
  let h=`<div class="modal-title">📋 Event Log</div>`;
  if(G.eventLog.length===0)h+=`<div class="empty-state"><div class="empty-icon">📋</div>No events recorded yet.</div>`;
  else G.eventLog.slice(0,40).forEach(e=>{h+=`<div class="log-item"><span class="log-icon">${e.icon}</span><span class="log-text">${e.text}</span><span class="log-year">Yr ${e.year}</span></div>`;});
  document.getElementById('modalContent').innerHTML=h;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function showAchievements(){
  const pct=Math.round((G.unlockedAchievements.length/ACHIEVEMENTS.length)*100);
  let h=`<div class="modal-title">🏆 Achievements — ${G.unlockedAchievements.length}/${ACHIEVEMENTS.length}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <div style="flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent-gold),#c97a00);border-radius:3px;"></div></div>
      <span style="font-size:12px;font-weight:700;color:var(--accent-gold);font-family:'Space Mono',monospace;">${pct}%</span>
    </div>`;
  ACHIEVEMENTS.forEach(a=>{
    const u=G.unlockedAchievements.includes(a.id);
    // FIX: correct style string — was missing closing quote causing parse error
    const opacity=u?'':'opacity:0.3;';
    h+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);${opacity}">
      <div style="font-size:24px;width:36px;text-align:center;">${a.icon}</div>
      <div style="flex:1;"><div style="font-size:13px;font-weight:700;">${a.name}</div><div style="font-size:11px;color:var(--text-muted);margin-top:1px;">${a.desc}</div></div>
      <div style="font-size:14px;">${u?'✅':'🔒'}</div>
    </div>`;
  });
  document.getElementById('modalContent').innerHTML=h;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function showSettings(){
  document.getElementById('modalContent').innerHTML=`
    <div class="modal-title">⚙️ Settings</div>
    <div style="color:var(--text-muted);font-size:12px;margin-bottom:16px;">${G.name} · Year ${G.year} · ${getEra()} · ${G.difficulty.toUpperCase()}</div>
    <div class="info-row"><span class="info-label">Leader</span><span class="info-val">${G.leaderName}</span></div>
    <div class="info-row"><span class="info-label">Trait</span><span class="info-val">${(LEADER_TRAITS.find(t=>t.id===G.leaderTrait)||{}).name||'-'}</span></div>
    <div class="info-row"><span class="info-label">Government</span><span class="info-val">${(GOVTS.find(g=>g.id===G.govt)||{}).name}</span></div>
    <div class="info-row"><span class="info-label">Prestige</span><span class="info-val" style="color:var(--accent-gold)">${fmt(G.prestige)} · ${getPrestigeRank(G.prestige)}</span></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
      <div class="event-choice" onclick="saveGame()">💾 Save to Browser</div>
      <div class="event-choice" onclick="exportSave()">📤 Export Save File</div>
      <div class="event-choice" onclick="importSave()">📂 Import Save File</div>
      <div class="event-choice" style="border-color:rgba(239,68,68,0.3);color:var(--accent-red);" onclick="closeModal();showSetup();">🔄 New Game</div>
      <div class="event-choice" onclick="closeModal()">❌ Close</div>
    </div>
    <div style="margin-top:24px;text-align:center;font-size:10px;color:var(--text-muted);letter-spacing:1px;">NATIONFORGE v3.1 · ULTIMATE EDITION</div>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden');}
function toast(icon,msg,type=''){
  const container=document.getElementById('toastContainer');
  const el=document.createElement('div');el.className='toast'+(type?' toast-'+type:'');
  el.innerHTML=`<span class="toast-icon">${icon}</span><span class="toast-msg">${msg}</span>`;
  container.appendChild(el);setTimeout(()=>el.remove(),3000);
}

// ---- EVENT LISTENERS (no inline onclick issues) ----
// Inject twinkling star particles into splash screen
function injectStars(){
  const splash=document.getElementById('splashScreen');if(!splash)return;
  const wrap=document.createElement('div');wrap.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;';
  for(let i=0;i<55;i++){
    const s=document.createElement('div');s.className='star-particle';
    const sz=(Math.random()*2+1).toFixed(1)+'px';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--sz:${sz};--dur:${(Math.random()*4+2).toFixed(1)}s;--del:${(Math.random()*6).toFixed(1)}s;--op:${(Math.random()*0.5+0.2).toFixed(2)};`;
    wrap.appendChild(s);
  }
  splash.appendChild(wrap);
}

document.addEventListener('DOMContentLoaded',()=>{
  injectStars();
  document.getElementById('newGameBtn').onclick=showSetup;
  document.getElementById('beginBtn').onclick=startGame;
  document.getElementById('nextTurnBtn').onclick=nextTurn;
  document.getElementById('logBtn').onclick=showLog;

  document.getElementById('settingsBtn').onclick=showSettings;
  document.getElementById('prestigeChip').onclick=()=>{switchNav('stats');};
  // showSetup() now handles hiding all screens and resetting state correctly
  document.getElementById('tryAgainBtn').onclick=showSetup;
  document.getElementById('continueBtn').onclick=()=>loadGame(false);
  document.getElementById('importFileInput').onchange=function(e){handleImport(e.target.files[0]);e.target.value='';};
  updateContinueBtn();
});
