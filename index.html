<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>NationForge — Country Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-card: #1a2235;
  --bg-card-hover: #1e2840;
  --accent-gold: #f0b429;
  --accent-gold-dim: rgba(240,180,41,0.15);
  --accent-blue: #3b82f6;
  --accent-blue-dim: rgba(59,130,246,0.15);
  --accent-green: #10b981;
  --accent-green-dim: rgba(16,185,129,0.15);
  --accent-red: #ef4444;
  --accent-red-dim: rgba(239,68,68,0.15);
  --accent-purple: #8b5cf6;
  --accent-purple-dim: rgba(139,92,246,0.15);
  --accent-cyan: #06b6d4;
  --accent-cyan-dim: rgba(6,182,212,0.15);
  --accent-orange: #f97316;
  --accent-orange-dim: rgba(249,115,22,0.15);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: rgba(255,255,255,0.06);
  --border-light: rgba(255,255,255,0.1);
  --shadow-heavy: 0 20px 60px rgba(0,0,0,0.5);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { 
  height:100%; overflow:hidden; 
  font-family:'Outfit',sans-serif; 
  background:var(--bg-primary); color:var(--text-primary);
  touch-action:manipulation;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:4px; }

/* ===== APP SHELL ===== */
#app {
  height:100%; display:flex; flex-direction:column;
  max-width:480px; margin:0 auto;
  position:relative; overflow:hidden;
}

/* ===== SCREENS ===== */
.screen {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
  will-change: transform, opacity;
}
.screen.hidden { transform:translateX(100%); opacity:0; pointer-events:none; }
.screen.hidden-left { transform:translateX(-30%); opacity:0; pointer-events:none; }

/* ===== SPLASH SCREEN ===== */
#splashScreen {
  background: radial-gradient(ellipse at 50% 30%, #1a2744 0%, #0a0e1a 70%);
  align-items:center; justify-content:center; gap:24px; z-index:100;
}
#splashScreen .logo-icon {
  width:100px; height:100px;
  background: linear-gradient(135deg, var(--accent-gold), #e08a00);
  border-radius:28px; display:flex; align-items:center; justify-content:center;
  font-size:48px; box-shadow: 0 0 60px rgba(240,180,41,0.3);
  animation: logoPulse 2s ease-in-out infinite;
}
@keyframes logoPulse {
  0%,100% { transform:scale(1); box-shadow: 0 0 60px rgba(240,180,41,0.3); }
  50% { transform:scale(1.05); box-shadow: 0 0 80px rgba(240,180,41,0.5); }
}
#splashScreen h1 {
  font-size:36px; font-weight:900; letter-spacing:-1px;
  background: linear-gradient(135deg, var(--accent-gold), #fff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
#splashScreen .tagline { color:var(--text-secondary); font-size:14px; font-weight:300; letter-spacing:2px; text-transform:uppercase; }
.start-btn {
  margin-top:40px; padding:16px 48px;
  background: linear-gradient(135deg, var(--accent-gold), #e08a00);
  border:none; border-radius:50px; color:#000; font-family:inherit;
  font-size:16px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  cursor:pointer; transition: all 0.3s ease;
  box-shadow: 0 4px 24px rgba(240,180,41,0.4);
}
.start-btn:active { transform:scale(0.96); }

/* ===== SETUP SCREEN ===== */
#setupScreen {
  background: var(--bg-primary);
  overflow-y:auto; padding:20px;
}
.setup-header { text-align:center; padding:30px 0 20px; }
.setup-header h2 { font-size:24px; font-weight:800; }
.setup-header p { color:var(--text-secondary); font-size:13px; margin-top:6px; }

.setup-section { margin-bottom:24px; }
.setup-section label {
  display:block; font-size:12px; font-weight:600; color:var(--text-secondary);
  text-transform:uppercase; letter-spacing:1.5px; margin-bottom:10px;
}
.setup-input {
  width:100%; padding:14px 16px;
  background:var(--bg-card); border:1px solid var(--border-light);
  border-radius:var(--radius-sm); color:var(--text-primary);
  font-family:inherit; font-size:16px; outline:none;
  transition: border-color 0.2s;
}
.setup-input:focus { border-color:var(--accent-gold); }
.setup-input::placeholder { color:var(--text-muted); }

.govt-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.govt-option {
  padding:14px 12px; background:var(--bg-card);
  border:2px solid var(--border-light); border-radius:var(--radius-sm);
  text-align:center; cursor:pointer; transition:all 0.2s;
}
.govt-option.selected {
  border-color:var(--accent-gold);
  background:var(--accent-gold-dim);
}
.govt-option .govt-icon { font-size:28px; margin-bottom:6px; }
.govt-option .govt-name { font-size:13px; font-weight:600; }
.govt-option .govt-desc { font-size:10px; color:var(--text-muted); margin-top:2px; }

.continent-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
}
.continent-option {
  padding:12px 8px; background:var(--bg-card);
  border:2px solid var(--border-light); border-radius:var(--radius-sm);
  text-align:center; cursor:pointer; transition:all 0.2s; font-size:12px;
}
.continent-option.selected { border-color:var(--accent-blue); background:var(--accent-blue-dim); }
.continent-option .cont-icon { font-size:24px; }
.continent-option .cont-name { font-size:11px; font-weight:600; margin-top:4px; }

.diff-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.diff-option {
  padding:14px 10px; background:var(--bg-card);
  border:2px solid var(--border-light); border-radius:var(--radius-sm);
  text-align:center; cursor:pointer; transition:all 0.2s;
}
.diff-option.selected { border-color:var(--accent-green); background:var(--accent-green-dim); }
.diff-option .diff-icon { font-size:24px; }
.diff-option .diff-name { font-size:12px; font-weight:700; margin-top:4px; }

.begin-btn {
  width:100%; padding:16px; margin-top:20px; margin-bottom:40px;
  background: linear-gradient(135deg, var(--accent-gold), #e08a00);
  border:none; border-radius:var(--radius-sm); color:#000;
  font-family:inherit; font-size:16px; font-weight:700;
  cursor:pointer; letter-spacing:0.5px;
}
.begin-btn:active { transform:scale(0.98); }

/* ===== GAME SCREEN ===== */
#gameScreen { background:var(--bg-primary); }

/* Top Bar */
.top-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:var(--bg-secondary);
  border-bottom:1px solid var(--border);
  position:relative; z-index:10;
}
.top-bar .nation-info { display:flex; align-items:center; gap:10px; }
.nation-flag {
  width:36px; height:36px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; background:var(--accent-gold-dim);
}
.nation-name { font-size:15px; font-weight:700; }
.nation-year { font-size:11px; color:var(--text-muted); font-family:'Space Mono',monospace; }
.top-actions { display:flex; gap:8px; }
.top-btn {
  width:36px; height:36px; border-radius:10px;
  background:var(--bg-card); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); font-size:16px; cursor:pointer;
}

/* Resource Bar */
.resource-bar {
  display:flex; gap:2px; padding:8px 12px;
  background:var(--bg-secondary); border-bottom:1px solid var(--border);
  overflow-x:auto; scrollbar-width:none;
}
.resource-bar::-webkit-scrollbar { display:none; }
.res-chip {
  display:flex; align-items:center; gap:4px;
  padding:4px 10px; background:var(--bg-card);
  border-radius:20px; white-space:nowrap; flex-shrink:0;
}
.res-chip .res-icon { font-size:12px; }
.res-chip .res-val {
  font-size:11px; font-weight:700;
  font-family:'Space Mono',monospace;
}
.res-chip.positive .res-val { color:var(--accent-green); }
.res-chip.negative .res-val { color:var(--accent-red); }

/* Main Content Area */
.game-content {
  flex:1; overflow-y:auto; padding:12px;
  padding-bottom:80px;
  scroll-behavior:smooth;
}

/* Stats Cards Row */
.stats-row {
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  margin-bottom:12px;
}
.stat-card {
  background:var(--bg-card); border-radius:var(--radius-sm);
  padding:12px; border:1px solid var(--border);
  position:relative; overflow:hidden;
}
.stat-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
}
.stat-card.gold::before { background:var(--accent-gold); }
.stat-card.blue::before { background:var(--accent-blue); }
.stat-card.green::before { background:var(--accent-green); }
.stat-card.red::before { background:var(--accent-red); }
.stat-card.purple::before { background:var(--accent-purple); }
.stat-card.cyan::before { background:var(--accent-cyan); }
.stat-card .stat-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
.stat-card .stat-value { font-size:20px; font-weight:800; margin-top:2px; font-family:'Space Mono',monospace; }
.stat-card .stat-change { font-size:10px; margin-top:2px; }
.stat-card .stat-change.up { color:var(--accent-green); }
.stat-card .stat-change.down { color:var(--accent-red); }

/* Approval Bar */
.approval-section {
  background:var(--bg-card); border-radius:var(--radius);
  padding:14px; margin-bottom:12px; border:1px solid var(--border);
}
.approval-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.approval-title { font-size:13px; font-weight:700; }
.approval-pct { font-size:18px; font-weight:800; font-family:'Space Mono',monospace; }
.approval-bar-track {
  height:8px; background:rgba(255,255,255,0.06); border-radius:4px;
  overflow:hidden; margin-bottom:8px;
}
.approval-bar-fill {
  height:100%; border-radius:4px;
  transition: width 0.6s ease, background 0.4s ease;
}
.approval-factors { display:flex; gap:6px; flex-wrap:wrap; }
.factor-tag {
  padding:3px 8px; border-radius:12px; font-size:10px; font-weight:600;
}

/* Sector Panels */
.sector-tabs {
  display:flex; gap:6px; margin-bottom:12px;
  overflow-x:auto; scrollbar-width:none; padding:2px 0;
}
.sector-tabs::-webkit-scrollbar { display:none; }
.sector-tab {
  padding:8px 14px; border-radius:20px;
  background:var(--bg-card); border:1px solid var(--border);
  white-space:nowrap; font-size:12px; font-weight:600;
  cursor:pointer; flex-shrink:0; transition:all 0.2s;
  display:flex; align-items:center; gap:5px;
}
.sector-tab.active {
  background:var(--accent-gold); color:#000;
  border-color:var(--accent-gold);
}
.sector-tab .tab-icon { font-size:14px; }

/* Sector Content */
.sector-content {
  background:var(--bg-card); border-radius:var(--radius);
  border:1px solid var(--border); overflow:hidden;
  margin-bottom:12px;
}
.sector-header {
  padding:14px; border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
}
.sector-header h3 { font-size:15px; font-weight:700; }
.sector-body { padding:14px; }

/* Policy Cards */
.policy-card {
  background:var(--bg-primary); border-radius:var(--radius-sm);
  padding:12px; margin-bottom:8px; border:1px solid var(--border);
  cursor:pointer; transition:all 0.2s;
}
.policy-card:active { transform:scale(0.98); background:var(--bg-card-hover); }
.policy-card .policy-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.policy-card .policy-name { font-size:13px; font-weight:700; }
.policy-card .policy-cost { font-size:11px; font-weight:600; font-family:'Space Mono',monospace; padding:2px 8px; border-radius:10px; }
.policy-card .policy-desc { font-size:11px; color:var(--text-secondary); line-height:1.4; }
.policy-card .policy-effects { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.policy-effect {
  font-size:10px; padding:2px 6px; border-radius:8px;
  font-weight:600;
}
.policy-effect.positive { background:var(--accent-green-dim); color:var(--accent-green); }
.policy-effect.negative { background:var(--accent-red-dim); color:var(--accent-red); }

/* Building / Infrastructure Cards */
.build-card {
  display:flex; gap:12px; padding:12px;
  background:var(--bg-primary); border-radius:var(--radius-sm);
  border:1px solid var(--border); margin-bottom:8px;
  cursor:pointer; transition:all 0.2s;
}
.build-card:active { transform:scale(0.98); }
.build-card .build-icon {
  width:44px; height:44px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; flex-shrink:0;
}
.build-card .build-info { flex:1; }
.build-card .build-name { font-size:13px; font-weight:700; }
.build-card .build-desc { font-size:10px; color:var(--text-muted); margin-top:2px; }
.build-card .build-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.build-card .build-cost { font-size:11px; font-weight:700; font-family:'Space Mono',monospace; color:var(--accent-gold); }
.build-card .build-time { font-size:10px; color:var(--text-muted); }
.build-card.locked { opacity:0.5; }

/* Events Panel */
.event-card {
  background:var(--bg-primary); border-radius:var(--radius-sm);
  padding:14px; margin-bottom:10px;
  border-left:3px solid var(--accent-orange);
}
.event-card.crisis { border-left-color:var(--accent-red); }
.event-card.opportunity { border-left-color:var(--accent-green); }
.event-card.diplomacy { border-left-color:var(--accent-blue); }
.event-card .event-type {
  font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:1.5px; margin-bottom:6px;
}
.event-card .event-title { font-size:14px; font-weight:700; margin-bottom:4px; }
.event-card .event-desc { font-size:12px; color:var(--text-secondary); line-height:1.5; }
.event-card .event-choices { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.event-choice {
  padding:10px 14px; border-radius:var(--radius-xs);
  background:var(--bg-card); border:1px solid var(--border);
  font-size:12px; font-weight:600; cursor:pointer;
  transition:all 0.2s; text-align:left;
}
.event-choice:active { background:var(--accent-gold-dim); border-color:var(--accent-gold); }

/* Diplomacy Map */
.diplo-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
.diplo-card {
  background:var(--bg-primary); border-radius:var(--radius-sm);
  padding:10px; border:1px solid var(--border);
  cursor:pointer; transition:all 0.2s;
}
.diplo-card:active { transform:scale(0.97); }
.diplo-card .diplo-flag { font-size:28px; }
.diplo-card .diplo-name { font-size:12px; font-weight:700; margin-top:4px; }
.diplo-card .diplo-relation {
  font-size:10px; font-weight:600; margin-top:2px;
  padding:2px 6px; border-radius:8px; display:inline-block;
}
.diplo-card .diplo-relation.friendly { background:var(--accent-green-dim); color:var(--accent-green); }
.diplo-card .diplo-relation.neutral { background:var(--accent-gold-dim); color:var(--accent-gold); }
.diplo-card .diplo-relation.hostile { background:var(--accent-red-dim); color:var(--accent-red); }
.diplo-card .diplo-relation.allied { background:var(--accent-blue-dim); color:var(--accent-blue); }

/* Military Section */
.mil-stat {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--border);
}
.mil-stat:last-child { border-bottom:none; }
.mil-stat .mil-label { font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
.mil-stat .mil-val { font-size:14px; font-weight:700; font-family:'Space Mono',monospace; }

/* Research Tree */
.research-card {
  display:flex; gap:10px; padding:12px;
  background:var(--bg-primary); border-radius:var(--radius-sm);
  border:1px solid var(--border); margin-bottom:8px;
  cursor:pointer; transition:all 0.2s;
}
.research-card:active { transform:scale(0.98); }
.research-card .rsch-icon { font-size:28px; flex-shrink:0; }
.research-card .rsch-name { font-size:13px; font-weight:700; }
.research-card .rsch-desc { font-size:10px; color:var(--text-muted); margin-top:2px; }
.research-card .rsch-bar {
  height:4px; background:rgba(255,255,255,0.06);
  border-radius:2px; margin-top:6px; overflow:hidden;
}
.research-card .rsch-bar-fill { height:100%; background:var(--accent-purple); border-radius:2px; transition:width 0.4s; }
.research-card.completed { border-color:var(--accent-green); opacity:0.7; }
.research-card.locked { opacity:0.4; }

/* Progress Bars */
.progress-row {
  margin-bottom:10px;
}
.progress-label { display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px; }
.progress-label .pl-name { font-weight:600; }
.progress-label .pl-val { font-family:'Space Mono',monospace; font-weight:700; }
.progress-track {
  height:6px; background:rgba(255,255,255,0.06);
  border-radius:3px; overflow:hidden;
}
.progress-fill {
  height:100%; border-radius:3px; transition:width 0.5s ease;
}

/* Turn Button */
.turn-section {
  position:absolute; bottom:68px; left:12px; right:12px;
  z-index:20;
}
.next-turn-btn {
  width:100%; padding:16px;
  background: linear-gradient(135deg, var(--accent-gold), #d4940a);
  border:none; border-radius:var(--radius-sm);
  color:#000; font-family:inherit; font-size:15px;
  font-weight:800; letter-spacing:0.5px; cursor:pointer;
  box-shadow: 0 4px 20px rgba(240,180,41,0.3);
  transition: all 0.2s; text-transform:uppercase;
}
.next-turn-btn:active { transform:scale(0.97); }

/* Bottom Nav */
.bottom-nav {
  position:absolute; bottom:0; left:0; right:0;
  display:flex; background:var(--bg-secondary);
  border-top:1px solid var(--border); z-index:20;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item {
  flex:1; display:flex; flex-direction:column;
  align-items:center; padding:10px 4px 8px;
  cursor:pointer; transition:all 0.2s;
  color:var(--text-muted); font-size:10px; gap:3px;
}
.nav-item.active { color:var(--accent-gold); }
.nav-item .nav-icon { font-size:20px; }
.nav-item .nav-label { font-weight:600; }

/* Modal / Event Overlay */
.modal-overlay {
  position:absolute; inset:0; z-index:50;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
  display:flex; align-items:flex-end; justify-content:center;
  transition:opacity 0.3s;
}
.modal-overlay.hidden { opacity:0; pointer-events:none; }
.modal-sheet {
  width:100%; max-height:85vh;
  background:var(--bg-secondary);
  border-radius:20px 20px 0 0;
  padding:20px; overflow-y:auto;
  transform:translateY(0);
  transition:transform 0.3s cubic-bezier(0.16,1,0.3,1);
}
.modal-overlay.hidden .modal-sheet { transform:translateY(100%); }
.modal-handle {
  width:40px; height:4px; background:var(--text-muted);
  border-radius:2px; margin:0 auto 16px;
}
.modal-title { font-size:20px; font-weight:800; margin-bottom:6px; }
.modal-desc { font-size:13px; color:var(--text-secondary); line-height:1.5; margin-bottom:16px; }

/* Notifications / Toast */
.toast-container {
  position:absolute; top:60px; left:12px; right:12px;
  z-index:60; display:flex; flex-direction:column; gap:6px;
}
.toast {
  padding:12px 14px; border-radius:var(--radius-sm);
  background:var(--bg-card); border:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  box-shadow: var(--shadow-heavy);
}
@keyframes toastIn { from { transform:translateY(-20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-10px); } }
.toast .toast-icon { font-size:18px; }
.toast .toast-msg { font-size:12px; font-weight:600; }

/* Turn animation */
.turn-overlay {
  position:absolute; inset:0; z-index:70;
  background:rgba(0,0,0,0.85);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  transition:opacity 0.4s;
}
.turn-overlay.hidden { opacity:0; pointer-events:none; }
.turn-overlay .turn-year {
  font-size:48px; font-weight:900;
  font-family:'Space Mono',monospace;

  margin:3px;
}

@media(min-width:481px) {

}

/* Animations */
@keyframes fadeUp {
  from { transform:translateY(12px); opacity:0; }
  to { transform:translateY(0); opacity:1; }
}
.fade-up { animation: fadeUp 0.4s ease both; }
.fade-up-d1 { animation-delay:0.05s; }
.fade-up-d2 { animation-delay:0.1s; }
.fade-up-d3 { animation-delay:0.15s; }
.fade-up-d4 { animation-delay:0.2s; }

.glow-gold { box-shadow: 0 0 20px rgba(240,180,41,0.2); }
.glow-blue { box-shadow: 0 0 20px rgba(59,130,246,0.2); }
.glow-green { box-shadow: 0 0 20px rgba(16,185,129,0.2); }

    treasuryIncome: Math.floor(800 * m),
    treasuryExpense: Math.floor(500 * m),
    
    economy: clamp(50 + (gm.economy||0)),
    happiness: clamp(55 + (gm.happiness||0)),
    stability: clamp(60 + (gm.stability||0)),
    military: clamp(30 + (gm.military||0)),
    research: clamp(20 + (gm.research||0)),
    diplomacy: clamp(50 + (gm.diplomacy||0)),
    environment: clamp(70),
    health: clamp(50),
    education: clamp(40 + (gm.research||0)),
    corruption: clamp(25 + (gm.corruption||0)),
    equality: clamp(50 + (gm.equality||0)),
    trade: clamp(40),
    production: clamp(45),
    energy: clamp(40),
    tourism: 20,
    espionage: 10,
    
    approval: 55,
    activePolicies: [],
    completedResearch: [],
    activeBuilds: [],
    
    policiesEnacted: 0,
    warsWon: 0, warsLost: 0,
    hasNukes: false, hasSpace: false,
    allies: 0,
    
    unlockedAchievements: [],
    eventHistory: [],
    pendingEvent: null,
    
    aiNations: AI_NATIONS.map(n => ({
      ...n,
      relation: Math.floor(Math.random()*40) + 30,
      relationLabel: 'neutral',
      tradeAgreement: false,
      alliance: false,
      atWar: false,
    })),
    
    warState: null,
    gameOver: false,
    gameOverReason: '',
  };
  
  updateRelationLabels();
}

function clamp(v, min=0, max=100) { return Math.max(min, Math.min(max, v)); }
function clampStat(key) { G[key] = clamp(G[key]); }

function fmt(n) {
  if(n>=1e9) return (n/1e9).toFixed(1)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return n.toString();
}

function fmtMoney(n) { return '$'+fmt(n); }

// ---- SCREENS ----
function showSetup() {
  document.getElementById('splashScreen').classList.add('hidden-left');
  document.getElementById('setupScreen').classList.remove('hidden');
  renderSetup();
}

function renderSetup() {
  // Govt grid
  let gh = '';
  GOVTS.forEach(g => {
    gh += `<div class="govt-option ${selectedGovt===g.id?'selected':''}" onclick="selectGovt('${g.id}')">
      <div class="govt-icon">${g.icon}</div>
      <div class="govt-name">${g.name}</div>
      <div class="govt-desc">${g.desc}</div>
    </div>`;
  });
  document.getElementById('govtGrid').innerHTML = gh;
  
  // Continent grid
  let ch = '';
  CONTINENTS.forEach(c => {
    ch += `<div class="continent-option ${selectedCont===c.id?'selected':''}" onclick="selectCont('${c.id}')">
      <div class="cont-icon">${c.icon}</div>
      <div class="cont-name">${c.name}</div>
    </div>`;
  });
  document.getElementById('contGrid').innerHTML = ch;
  
  // Difficulty
  let dh = '';
  DIFFICULTIES.forEach(d => {
    dh += `<div class="diff-option ${selectedDiff===d.id?'selected':''}" onclick="selectDiff('${d.id}')">
      <div class="diff-icon">${d.icon}</div>
      <div class="diff-name">${d.name}</div>
    </div>`;
  });
  document.getElementById('diffGrid').innerHTML = dh;
}

function selectGovt(id) { selectedGovt = id; renderSetup(); }
function selectCont(id) { selectedCont = id; renderSetup(); }
function selectDiff(id) { selectedDiff = id; renderSetup(); }

function startGame() {
  const name = document.getElementById('nationNameInput').value.trim() || 'New Republic';
  const flag = document.getElementById('flagInput').value.trim() || '🏴';
  if(!selectedGovt) { toast('⚠️','Select a government type'); return; }
  if(!selectedCont) { toast('⚠️','Select a continent'); return; }
  if(!selectedDiff) { toast('⚠️','Select difficulty'); return; }
  
  initState(name, flag, selectedGovt, selectedCont, selectedDiff);
  
  document.getElementById('setupScreen').classList.add('hidden-left');
  document.getElementById('gameScreen').classList.remove('hidden');
  
  renderGame();
  toast('🏛️', `${G.name} has been founded!`);
}

// ---- MAIN RENDER ----
function renderGame() {
  document.getElementById('gameFlag').textContent = G.flag;
  document.getElementById('gameName').textContent = G.name;
  document.getElementById('gameYear').textContent = `Year ${G.year} — ${getEra()}`;
  renderResourceBar();
  renderBottomNav();
  renderGameContent();
}

function getEra() {
  if(G.year<10) return 'Foundation Era';
  if(G.year<25) return 'Growth Era';
  if(G.year<50) return 'Industrial Era';
  if(G.year<75) return 'Modern Era';
  if(G.year<100) return 'Information Age';
  return 'Space Age';
}

function renderGameContent() {
  const el = document.getElementById('gameContent');
  switch(currentNavTab) {
    case 'home': el.innerHTML = renderHome(); break;
    case 'policy': el.innerHTML = renderPolicyTab(); break;
    case 'build': el.innerHTML = renderBuildTab(); break;
    case 'world': el.innerHTML = renderWorldTab(); break;
    case 'stats': el.innerHTML = renderStatsTab(); break;
  }
}

function renderProgressBar(label, key, color, inverted=false) {
  const val = G[key];
  const displayColor = inverted ? (val>50?'var(--accent-red)':'var(--accent-green)') : color;
  return `<div class="progress-row">
    <div class="progress-label"><span class="pl-name">${label}</span><span class="pl-val" style="color:${displayColor}">${Math.round(val)}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${val}%;background:${displayColor}"></div></div>
  </div>`;
}

function findPolicy(id) {
  for(let cat of Object.values(POLICIES)) {
    const p = cat.find(x=>x.id===id);
    if(p) return p;
  }
  return null;
}

// ---- POLICY TAB ----
function renderPolicyTab() {
  const categories = [
    { id:'economy', icon:'💰', label:'Economy' },
    { id:'social', icon:'👥', label:'Social' },
    { id:'military', icon:'⚔️', label:'Military' },
    { id:'research', icon:'🔬', label:'Research' },
    { id:'infrastructure', icon:'🏗️', label:'Infra' },
  ];
  
  let tabsHtml = categories.map(c=>`<div class="sector-tab ${currentTab===c.id?'active':''}" onclick="currentTab='${c.id}';renderGameContent();">
    <span class="tab-icon">${c.icon}</span>${c.label}
  </div>`).join('');
  
  const policies = POLICIES[currentTab] || POLICIES.economy;
  let policiesHtml = policies.map(p => {
    const isActive = G.activePolicies.includes(p.id);
    const canAfford = G.treasury >= p.cost;
    const effectsHtml = Object.entries(p.effects).map(([k,v])=>{
      return `<span class="policy-effect ${v>0?'positive':'negative'}">${k}: ${v>0?'+':''}${v}</span>`;
    }).join('');
    
    return `<div class="policy-card ${isActive?'glow-green':''}" onclick="${isActive?'':`enactPolicy('${p.id}')`}" style="${!canAfford&&!isActive?'opacity:0.5':''}">
      <div class="policy-top">
        <span class="policy-name">${isActive?'✅ ':''} ${p.name}</span>
        <span class="policy-cost" style="background:${canAfford||isActive?'var(--accent-gold-dim)':'var(--accent-red-dim)'}; color:${canAfford||isActive?'var(--accent-gold)':'var(--accent-red)'}">
          ${isActive?'ACTIVE':fmtMoney(p.cost)}
        </span>
      </div>
      <div class="policy-desc">${p.desc}</div>
      <div class="policy-effects">${effectsHtml}</div>
    </div>`;
  }).join('');
  
  return `
  <div class="sector-tabs">${tabsHtml}</div>
  <div style="margin-bottom:12px;">
    <div style="font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;">
      <span>Treasury: <strong style="color:var(--accent-gold)">${fmtMoney(G.treasury)}</strong></span>
      <span>Active Policies: <strong>${G.activePolicies.length}</strong></span>
    </div>
  </div>
  ${policiesHtml}
  <div style="height:80px;"></div>`;
}

function enactPolicy(id) {
  const p = findPolicy(id);
  if(!p) return;
  if(G.activePolicies.includes(id)) { toast('ℹ️','Already active'); return; }
  if(G.treasury < p.cost) { toast('❌','Not enough funds!'); return; }
  
  G.treasury -= p.cost;
  G.activePolicies.push(id);
  G.policiesEnacted++;
  
  applyEffects(p.effects);
  
  toast('✅', `${p.name} enacted!`);
  checkAchievements();
  renderGame();
}

function applyEffects(effects) {
  Object.entries(effects).forEach(([k,v]) => {
    if(k==='treasury') G.treasury += v * 10;
    else if(k==='population') G.population += v * 100000;
    else if(k==='trade') G.trade = clamp(G.trade + v);
    else if(k==='production') G.production = clamp(G.production + v);
    else if(k==='energy') G.energy = clamp(G.energy + v);
    else if(k==='tourism') G.tourism = clamp(G.tourism + v);
    else if(k==='espionage') G.espionage = clamp(G.espionage + v);
    else if(G[k] !== undefined) G[k] = clamp(G[k] + v);
  });
}

// ---- BUILD TAB ----

  infra.forEach(p => {
    const isBuilt = G.activePolicies.includes(p.id);
    const canAfford = G.treasury >= p.cost;
    const bgColor = isBuilt ? 'var(--accent-green-dim)' : 'var(--accent-blue-dim)';
    
    h += `<div class="build-card ${isBuilt?'':''}${!canAfford&&!isBuilt?'locked':''}" onclick="${isBuilt?'':`enactPolicy('${p.id}')`}">
      <div class="build-icon" style="background:${bgColor}">
        ${isBuilt?'✅':'🏗️'}
      </div>
      <div class="build-info">
        <div class="build-name">${p.name}</div>
        <div class="build-desc">${p.desc}</div>
        <div class="build-bottom">
          <span class="build-cost">${isBuilt?'BUILT':fmtMoney(p.cost)}</span>
          <span class="build-time">${isBuilt?'Completed':'~2 years'}</span>
        </div>
      </div>
    </div>`;
  });
  
  // Also show some special mega projects
  const megaProjects = [
    { id:'wonder', name:'National Wonder', desc:'A breathtaking monument symbolizing your nation\'s greatness.', cost:5000, icon:'🏛️', effects:{happiness:20, tourism:25, diplomacy:10} },
    { id:'arcology', name:'Arcology', desc:'A self-sustaining mega-structure housing millions.', cost:8000, icon:'🌆', effects:{happiness:15, environment:10, population:20, research:10} },
    { id:'orbital', name:'Orbital Station', desc:'Build a permanent space station in orbit.', cost:10000, icon:'🛰️', effects:{research:30, military:15, diplomacy:20} },
  ];
  
  h += `<div style="margin-top:20px;margin-bottom:12px;font-size:14px;font-weight:700;">🏗️ Mega Projects</div>`;
  megaProjects.forEach(p => {
    const isBuilt = G.activePolicies.includes(p.id);
    const canAfford = G.treasury >= p.cost;
    h += `<div class="build-card ${!canAfford&&!isBuilt?'locked':''}" onclick="${isBuilt?'':`enactMega('${p.id}',${p.cost},'${p.name}',${JSON.stringify(p.effects).replace(/"/g,'&quot;')})`}">
      <div class="build-icon" style="background:var(--accent-purple-dim);font-size:24px">${p.icon}</div>
      <div class="build-info">
        <div class="build-name">${p.name}</div>
        <div class="build-desc">${p.desc}</div>
        <div class="build-bottom">
          <span class="build-cost">${isBuilt?'BUILT':fmtMoney(p.cost)}</span>
          <span class="build-time">${isBuilt?'Completed':'~5 years'}</span>
        </div>
      </div>
    </div>`;
  });
  
  return h + '<div style="height:80px;"></div>';
}

function enactMega(id, cost, name, effects) {
  if(G.activePolicies.includes(id)) return;
  if(G.treasury < cost) { toast('❌','Not enough funds!'); return; }
  G.treasury -= cost;
  G.activePolicies.push(id);
  G.policiesEnacted++;
  applyEffects(effects);
  toast('🏗️', `${name} completed!`);
  checkAchievements();
  renderGame();
}

// ---- WORLD TAB ----
function renderWorldTab() {
  const tabs = [
    { id:'diplo', label:'🌍 Diplomacy' },
    { id:'trade', label:'📦 Trade' },
    { id:'war', label:'⚔️ Military' },

  let tabsHtml = tabs.map(t=>`<div class="sector-tab ${currentTab===t.id?'active':''}" onclick="currentTab='${t.id}';renderGameContent();">${t.label}</div>`).join('');

  if(currentTab==='diplo' || (!['diplo','trade','war'].includes(currentTab))) {

  return `<div class="sector-tabs">${tabsHtml}</div>${bodyHtml}<div style="height:80px;"></div>`;
}

function renderDiplomacy() {
  let h = `<div class="diplo-grid">`;
  G.aiNations.forEach((n,i) => {
    const relClass = n.atWar?'hostile':n.alliance?'allied':n.relation>60?'friendly':n.relation>35?'neutral':'hostile';
    const relLabel = n.atWar?'AT WAR':n.alliance?'Allied':n.relation>60?'Friendly':n.relation>35?'Neutral':'Hostile';
    h += `<div class="diplo-card" onclick="showDiploModal(${i})">
      <div class="diplo-flag">${n.flag}</div>
      <div class="diplo-name">${n.name}</div>
      <div class="diplo-relation ${relClass}">${relLabel} (${n.relation})</div>
    </div>`;
  });
  h += `</div>`;
  return h;
}

function renderTradePanel() {
  const resources = [
    { icon:'⛽', name:'Oil', val:Math.floor(G.production*0.8), price:Math.floor(G.economy*12) },
    { icon:'⚙️', name:'Manufactured Goods', val:Math.floor(G.production*1.2), price:Math.floor(G.economy*8) },
    { icon:'🌾', name:'Agriculture', val:Math.floor(G.environment*0.6+30), price:Math.floor(G.economy*5) },
    { icon:'💎', name:'Minerals', val:Math.floor(G.production*0.5), price:Math.floor(G.economy*15) },
    { icon:'💻', name:'Technology', val:Math.floor(G.research*1.1), price:Math.floor(G.research*10) },
    { icon:'🎭', name:'Culture & Tourism', val:Math.floor(G.tourism), price:Math.floor(G.happiness*3) },
  ];
  
  let h = `<div style="margin-bottom:12px;">
    <div style="font-size:12px;color:var(--text-muted);">Trade balance: <strong style="color:var(--accent-gold)">${fmtMoney(Math.floor(G.trade*G.economy*0.5))}</strong>/yr</div>
  </div>`;
  
  resources.forEach(r => {
    h += `<div class="trade-item">
      <div class="trade-left">
        <span class="trade-icon">${r.icon}</span>
        <span class="trade-name">${r.name}</span>
      </div>
      <div class="trade-val" style="color:var(--accent-gold)">${fmtMoney(r.price)}</div>
    </div>`;
  });
  
  h += `<div style="margin-top:16px;font-size:14px;font-weight:700;">📊 Trade Agreements</div>`;
  G.aiNations.filter(n=>n.tradeAgreement).forEach(n => {
    h += `<div class="trade-item" style="margin-top:6px;">
      <div class="trade-left">
        <span class="trade-icon">${n.flag}</span>
        <span class="trade-name">${n.name}</span>
      </div>
      <div class="trade-val" style="color:var(--accent-green)">Active</div>
    </div>`;
  });
  if(!G.aiNations.some(n=>n.tradeAgreement)) {
    h += `<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:12px;">No trade agreements. Improve relations with other nations.</div>`;
  }
  
  return h;
}

function renderMilitary() {
  const stats = [
    { icon:'👮', label:'Army Size', val:fmt(Math.floor(G.population*G.military/500))},
    { icon:'✈️', label:'Air Force', val:fmt(Math.floor(G.military*12))},
    { icon:'🚢', label:'Naval Fleet', val:fmt(Math.floor(G.military*5))},
    { icon:'🛡️', label:'Defense Rating', val:G.military},
    { icon:'💣', label:'Offensive Power', val:Math.floor(G.military*0.8)},
    { icon:'🕵️', label:'Intelligence', val:G.espionage},
    { icon:'☢️', label:'Nuclear Arsenal', val:G.hasNukes?'YES':'NO'},
    { icon:'📡', label:'Cyber Warfare', val:G.activePolicies.includes('cyber')?'Active':'None'},
  ];

      <div class="war-vs">
        <div class="war-side">
          <div class="war-flag">${G.flag}</div>
          <div class="war-name">${G.name}</div>
          <div class="war-str">STR: ${G.military}</div>
        </div>
        <div class="war-vs-text">VS</div>
        <div class="war-side">
          <div class="war-flag">${enemy?enemy.flag:'?'}</div>
          <div class="war-name">${enemy?enemy.name:'Unknown'}</div>
          <div class="war-str">STR: ${enemy?enemy.strength:'?'}</div>
        </div>

      <div class="mil-stat"><span class="mil-label">Continent</span><span class="mil-val">${CONTINENTS.find(c=>c.id===G.continent).name}</span></div>
      <div class="mil-stat"><span class="mil-label">Population</span><span class="mil-val">${fmt(G.population)}</span></div>
      <div class="mil-stat"><span class="mil-label">GDP/Capita</span><span class="mil-val">$${fmt(G.gdp)}</span></div>
      <div class="mil-stat"><span class="mil-label">Year</span><span class="mil-val">${G.year}</span></div>
      <div class="mil-stat"><span class="mil-label">Era</span><span class="mil-val">${getEra()}</span></div>
      <div class="mil-stat"><span class="mil-label">Policies</span><span class="mil-val">${G.activePolicies.length}</span></div>
      <div class="mil-stat"><span class="mil-label">Wars Won</span><span class="mil-val">${G.warsWon}</span></div>

// ---- DIPLOMACY MODAL ----
function showDiploModal(idx) {
  const n = G.aiNations[idx];
  const relClass = n.atWar?'hostile':n.alliance?'allied':n.relation>60?'friendly':n.relation>35?'neutral':'hostile';
  const relLabel = n.atWar?'AT WAR':n.alliance?'Allied':n.relation>60?'Friendly':n.relation>35?'Neutral':'Hostile';
  
  let actions = '';
  if(!n.atWar) {
    if(!n.tradeAgreement && n.relation>30) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'trade')">📦 Propose Trade Agreement (Cost: $500)</div>`;
    }
    if(!n.alliance && n.relation>60) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'ally')">🤝 Form Alliance (Cost: $1000)</div>`;
    }
    if(n.relation<70) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'gift')">🎁 Send Foreign Aid (+15 relations, Cost: $800)</div>`;
    }
    if(!n.atWar && n.relation<60) {
      actions += `<div class="event-choice" onclick="diploAction(${idx},'war')" style="border-color:var(--accent-red);color:var(--accent-red);">⚔️ Declare War</div>`;
    }
  } else {
    actions += `<div class="event-choice" onclick="diploAction(${idx},'peace')">🕊️ Negotiate Peace (Cost: $2000)</div>`;
  }
  
  document.getElementById('modalContent').innerHTML = `
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-size:56px;">${n.flag}</div>
      <div class="modal-title">${n.name}</div>
      <div class="diplo-relation ${relClass}" style="display:inline-block;margin-top:4px;font-size:13px;padding:4px 12px;">${relLabel} — ${n.relation}/100</div>
    </div>
    <div style="margin-bottom:12px;">
      <div class="mil-stat"><span class="mil-label">Personality</span><span class="mil-val">${n.personality}</span></div>
      <div class="mil-stat"><span class="mil-label">Military Strength</span><span class="mil-val">${n.strength}</span></div>
      <div class="mil-stat"><span class="mil-label">Trade Agreement</span><span class="mil-val">${n.tradeAgreement?'✅ Yes':'❌ No'}</span></div>
      <div class="mil-stat"><span class="mil-label">Alliance</span><span class="mil-val">${n.alliance?'✅ Yes':'❌ No'}</span></div>
    </div>
    <div style="font-size:13px;font-weight:700;margin-bottom:8px;">Actions</div>
    ${actions}
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function diploAction(idx, action) {
  const n = G.aiNations[idx];
  switch(action) {
    case 'trade':
      if(G.treasury<500){toast('❌','Not enough funds!');return;}
      G.treasury-=500; n.tradeAgreement=true; n.relation=Math.min(100,n.relation+10);
      G.trade=clamp(G.trade+5);
      toast('📦',`Trade agreement with ${n.name}!`);
      break;
    case 'ally':
      if(G.treasury<1000){toast('❌','Not enough funds!');return;}
      G.treasury-=1000; n.alliance=true; n.relation=Math.min(100,n.relation+20);
      G.allies++;
      toast('🤝',`Alliance formed with ${n.name}!`);
      break;
    case 'gift':
      if(G.treasury<800){toast('❌','Not enough funds!');return;}
      G.treasury-=800; n.relation=Math.min(100,n.relation+15);
      toast('🎁',`Relations improved with ${n.name}!`);
      break;
    case 'war':
      n.atWar=true; n.alliance=false; n.tradeAgreement=false;
      n.relation=0;
      G.warState={enemy:idx,turns:0};
      G.diplomacy=clamp(G.diplomacy-10);
      toast('⚔️',`War declared on ${n.name}!`);
      break;
    case 'peace':
      if(G.treasury<2000){toast('❌','Not enough funds!');return;}
      G.treasury-=2000; n.atWar=false; n.relation=25;
      G.warState=null;
      toast('🕊️',`Peace with ${n.name}!`);
      break;
  }
  updateRelationLabels();
  closeModal();
  checkAchievements();
  renderGame();
}

function updateRelationLabels() {
  G.aiNations.forEach(n => {
    n.relationLabel = n.atWar?'hostile':n.alliance?'allied':n.relation>60?'friendly':n.relation>35?'neutral':'hostile';
  });
  G.allies = G.aiNations.filter(n=>n.alliance).length;
}

// ---- EVENTS ----
function resolveEvent(choiceIdx) {
  if(!G.pendingEvent) return;
  const choice = G.pendingEvent.choices[choiceIdx];
  applyEffects(choice.effects);
  G.eventHistory.push({ title:G.pendingEvent.title, choice:choice.text, year:G.year });
  toast('📢', `Decision made: ${G.pendingEvent.title}`);
  G.pendingEvent = null;
  checkAchievements();
  renderGame();
}

function triggerRandomEvent() {
  if(G.pendingEvent) return; // one at a time
  if(Math.random() < 0.55) { // 55% chance per year
    const evt = EVENTS[Math.floor(Math.random()*EVENTS.length)];
    G.pendingEvent = JSON.parse(JSON.stringify(evt));
  }
}

// ---- NEXT TURN ----
function nextTurn() {
  if(G.pendingEvent) {
    toast('⚠️','Resolve the current event first!');
    currentNavTab='home'; renderBottomNav(); renderGameContent();
    return;
  }
  
  // Show turn overlay
  G.year++;
  const overlay = document.getElementById('turnOverlay');
  document.getElementById('turnYear').textContent = `Year ${G.year}`;
  overlay.classList.remove('hidden');
  
  setTimeout(() => {
    overlay.classList.add('hidden');
    processTurn();
    renderGame();
  }, 900);
}

function processTurn() {
  // Population growth
  const growthRate = 1 + (G.populationGrowth / 100) * (G.health/80) * (G.happiness/60);
  G.population = Math.floor(G.population * growthRate);
  
  // GDP based on economy
  G.gdp = Math.floor(G.gdp * (1 + (G.economy - 45) / 500));
  
  // Treasury
  G.treasuryIncome = Math.floor((G.economy * 12 + G.trade * 8 + G.production * 5 + G.tourism * 3) * (G.population / 5000000));
  G.treasuryExpense = Math.floor((G.activePolicies.length * 80 + G.military * 15 + G.population / 100000) * (G.difficulty==='hard'?1.5:G.difficulty==='easy'?0.7:1));
  G.treasury += G.treasuryIncome - G.treasuryExpense;
  
  // Natural stat decay/drift
  G.happiness += (Math.random()-0.5)*4 + (G.economy>50?1:-1) + (G.corruption>40?-2:0) + (G.health>50?1:0);
  G.stability += (Math.random()-0.5)*3 + (G.happiness>50?0.5:-1) + (G.corruption>50?-1:0);
  G.corruption += (Math.random()-0.4)*2;
  G.environment += (Math.random()-0.55)*2 + (G.production>60?-1:0);
  G.economy += (Math.random()-0.5)*3 + (G.education>50?0.5:0) + (G.trade>50?0.5:0);
  G.research += (Math.random()-0.4)*2 + (G.education>50?0.5:0);
  G.health += (Math.random()-0.5)*2;
  G.education += (Math.random()-0.4)*1.5;
  
  // Clamp all
  ['economy','happiness','stability','military','research','diplomacy','environment','health','education','corruption','equality','trade','production','energy','tourism','espionage'].forEach(k=>clampStat(k));
  
  // Approval calculation
  G.approval = clamp(
    G.happiness * 0.3 +
    G.economy * 0.2 +
    G.stability * 0.15 +
    G.health * 0.1 +
    G.education * 0.1 +
    (100 - G.corruption) * 0.15
  );
  
  // AI Nation drift
  G.aiNations.forEach(n => {
    if(!n.atWar) {
      const drift = (Math.random()-0.5)*6;
      n.relation = clamp(n.relation + drift);
      // Personality-based aggression
      if(n.personality==='aggressive' && Math.random()<0.05 && n.relation<30) {
        n.atWar = true; n.alliance = false; n.tradeAgreement = false;
        G.warState = {enemy:G.aiNations.indexOf(n),turns:0};
        toast('⚔️',`${n.name} declared war on you!`);
      }
    }
    n.strength += Math.floor((Math.random()-0.4)*3);
    n.strength = clamp(n.strength, 20, 95);
  });
  updateRelationLabels();
  
  // War resolution
  if(G.warState) {
    G.warState.turns++;
    const enemy = G.aiNations[G.warState.enemy];
    if(G.warState.turns >= 3) {
      const myPower = G.military + (G.hasNukes?20:0) + G.espionage*0.3;
      const enemyPower = enemy.strength + Math.random()*20;
      if(myPower > enemyPower) {
        // Victory
        enemy.atWar=false; enemy.relation=20;
        G.treasury += 3000; G.warsWon++;
        G.warState=null;
        toast('🏆',`Victory against ${enemy.name}! War spoils collected.`);
      } else if(G.warState.turns >= 6) {
        // Defeat
        enemy.atWar=false; enemy.relation=10;
        G.treasury -= 2000; G.warsLost++;
        G.military = clamp(G.military - 15);
        G.happiness = clamp(G.happiness - 10);
        G.warState=null;
        toast('💀',`Defeat against ${enemy.name}...`);
      }
    }
    // War costs
    if(G.warState) {
      G.treasury -= 500;
      G.happiness = clamp(G.happiness - 3);
      G.economy = clamp(G.economy - 2);
    }
  }
  
  // Trigger events
  triggerRandomEvent();
  
  // Check nukes/space for achievements
  if(G.activePolicies.includes('nukes')) G.hasNukes=true;
  if(G.activePolicies.includes('space')) G.hasSpace=true;
  
  // Check game over conditions
  if(G.treasury < -5000) { gameOver('Your nation went bankrupt. The treasury is empty and creditors have seized control.', false); return; }
  if(G.stability < 5) { gameOver('Civil war erupted! Your government collapsed under extreme instability.', false); return; }
  if(G.happiness < 5) { gameOver('Revolution! The people rose up and overthrew your government.', false); return; }
  if(G.approval < 5) { gameOver('Voted out! Your approval rating hit rock bottom and you were removed from power.', false); return; }
  
  // Victory conditions
  if(G.year >= 200) { gameOver('After 200 years of rule, your nation stands as an eternal civilization!', true); return; }
  
  checkAchievements();
}

function gameOver(reason, isWin) {
  G.gameOver = true;
  G.gameOverReason = reason;
  
  document.getElementById('gameScreen').classList.add('hidden-left');
  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('goIcon').textContent = isWin ? '🎉' : '💀';
  document.getElementById('goTitle').textContent = isWin ? 'Legendary Nation!' : 'Nation Collapsed';
  document.getElementById('goReason').textContent = reason;
  document.getElementById('goStats').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin-top:16px;">
      <div class="stat-card gold"><div class="stat-label">Years</div><div class="stat-value">${G.year}</div></div>
      <div class="stat-card blue"><div class="stat-label">Population</div><div class="stat-value">${fmt(G.population)}</div></div>
      <div class="stat-card green"><div class="stat-label">Treasury</div><div class="stat-value">${fmtMoney(G.treasury)}</div></div>
      <div class="stat-card purple"><div class="stat-label">Achievements</div><div class="stat-value">${G.unlockedAchievements.length}</div></div>
    </div>
  `;
}

// ---- ACHIEVEMENTS ----
function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if(!G.unlockedAchievements.includes(a.id) && a.check(G)) {
      G.unlockedAchievements.push(a.id);
      toast(a.icon, `Achievement: ${a.name}!`);
    }
  });
}

function showAchievements() {
  let h = `<div class="modal-title">🏆 Achievements</div>
  <div class="modal-desc">${G.unlockedAchievements.length} of ${ACHIEVEMENTS.length} unlocked</div>`;
  ACHIEVEMENTS.forEach(a => {
    const unlocked = G.unlockedAchievements.includes(a.id);
    h += `<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);${unlocked?'':'opacity:0.4;'}">
      <div style="font-size:24px;">${a.icon}</div>
      <div><div style="font-size:13px;font-weight:700;">${a.name}</div><div style="font-size:11px;color:var(--text-muted);">${a.desc}</div></div>
      <div style="margin-left:auto;font-size:12px;color:${unlocked?'var(--accent-green)':'var(--text-muted)'};">${unlocked?'✅':'🔒'}</div>
    </div>`;
  });
  document.getElementById('modalContent').innerHTML = h;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function showSettings() {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">⚙️ Settings</div>
    <div style="margin-top:12px;">
      <div class="event-choice" onclick="if(confirm('Reset game?'))location.reload();">🔄 Restart Game</div>
      <div class="event-choice" onclick="closeModal()">❌ Close</div>
    </div>
    <div style="margin-top:20px;text-align:center;font-size:11px;color:var(--text-muted);">
      NationForge v1.0<br>Built with ❤️
    </div>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

// ---- MODAL ----
function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

// ---- TOASTS ----
function toast(icon, msg) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast-icon">${icon}</span><span class="toast-msg">${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

document.addEventListener('DOMContentLoaded', () => {

  selectedGovt = 'democracy';
  selectedCont = 'as';
  selectedDiff = 'normal';
  document.getElementById('nationNameInput').value = '';
  document.getElementById('flagInput').value = '🇮🇳';
});
